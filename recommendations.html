<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추천도서 · 성의고등학교 도서관</title><style>
:root{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",Arial,sans-serif;color:#34383e;--blue:#4f6ed6;--line:#e5e7eb;--muted:#858b93}*{box-sizing:border-box}body{margin:0;background:#fff}.top{max-width:1120px;margin:auto;padding:28px 24px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;text-decoration:none;color:#34383e;font-size:14px}.home{font-size:12.5px;text-decoration:none;color:#747b84;border:1px solid var(--line);padding:8px 12px;border-radius:18px}.wrap{max-width:1120px;margin:auto;padding:42px 24px 80px}.back{display:inline-block;color:#6878ad;text-decoration:none;font-size:12.5px;font-weight:700;margin-bottom:20px}.title{font-size:29px;font-weight:850;letter-spacing:-.7px;color:#2f3338;margin:0}.desc{font-size:13.5px;color:var(--muted);margin:9px 0 34px;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:38px 24px;padding-top:4px}.book{text-decoration:none;color:inherit;min-width:0}.coverbox{aspect-ratio:2/2.9;border-radius:6px;overflow:hidden;background:#eef0f3;border:1px solid #e8eaee;box-shadow:0 2px 7px rgba(35,40,50,.035)}.cover{width:100%;height:100%;object-fit:cover;display:block}.nocover{height:100%;display:flex;align-items:center;justify-content:center;color:#9da2a9;font-size:11px;text-align:center;padding:14px}.bt{font-weight:700;font-size:14.5px;letter-spacing:-.18px;line-height:1.45;color:#3d4248;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ba{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book:hover .bt{color:var(--blue)}.status{color:#777;padding:40px 0}@media(max-width:980px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:34px 20px}}@media(max-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 16px}.wrap{padding:30px 20px 65px}.top{padding:22px 20px}.title{font-size:26px}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 14px}.wrap{padding:24px 17px 55px}.top{padding:19px 17px}.desc{margin-bottom:28px}}
</style></head><body><div class="top"><a class="brand" href="/">성의고등학교 도서관</a><a class="home" href="/">처음 화면</a></div><main class="wrap"><a class="back" href="/">← 추천도서가 있는 첫 화면으로</a><h1 id="title" class="title">추천도서</h1><div id="desc" class="desc"></div><div id="status" class="status">추천목록을 불러오는 중…</div><div id="grid" class="grid"></div></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('list')||'';function href(b){return '/topic-search.html?q='+encodeURIComponent(b.title||'')+'&book='+encodeURIComponent(b.id||'')+'&chunk='+encodeURIComponent(b.chunk??0)}
(async()=>{if(!id){$('status').textContent='추천목록을 찾을 수 없습니다.';return;}try{const r=await fetch('/api/index?route=recommendations&mode=list&id='+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error(j.message||'추천목록을 불러오지 못했습니다.');const l=j.list;$('title').textContent=l.name||'추천도서';$('desc').textContent=l.description||'';document.title=(l.name||'추천도서')+' · 성의고등학교 도서관';$('status').style.display='none';$('grid').innerHTML=(l.items||[]).map(x=>{const b=x.book||{};recBookMap.set(b.id,b);return `<a class="book" data-book="${esc(b.id)}" href="${href(b)}"><div class="coverbox">${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy">`:`<div class="nocover">${esc(b.title||'표지 없음')}</div>`}</div><div class="bt">${esc(b.title)}</div><div class="ba">${esc(b.author)}</div></a>`}).join('');$('grid').querySelectorAll('.book').forEach(a=>a.addEventListener('click',()=>rememberRecBook(a.dataset.book)));}catch(e){$('status').textContent=e.message;}})();
</script></body></html>
