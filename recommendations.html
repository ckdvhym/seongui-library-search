<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추천도서 · 성의고등학교 도서관</title><style>
:root{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",Arial,sans-serif;color:#222;--blue:#4f6ed6;--line:#e2e5eb}*{box-sizing:border-box}body{margin:0;background:#fff}.top{max-width:1180px;margin:auto;padding:28px 24px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;text-decoration:none;color:#222}.home{font-size:13px;text-decoration:none;color:#69717c;border:1px solid var(--line);padding:8px 12px;border-radius:18px}.wrap{max-width:1180px;margin:auto;padding:35px 24px 70px}.back{display:inline-block;color:#6575af;text-decoration:none;font-size:13px;font-weight:800;margin-bottom:20px}.title{font-size:31px;font-weight:900;letter-spacing:-.8px;margin:0}.desc{color:#747a82;margin:10px 0 32px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 20px}.book{text-decoration:none;color:inherit}.coverbox{aspect-ratio:2/2.9;border-radius:9px;overflow:hidden;background:#f0f1f4;border:1px solid #eceef2}.cover{width:100%;height:100%;object-fit:cover}.nocover{height:100%;display:flex;align-items:center;justify-content:center;color:#a1a5ad;font-size:12px;text-align:center;padding:16px}.bt{font-weight:850;font-size:14px;line-height:1.45;margin-top:9px}.ba{font-size:12px;color:#858b93;margin-top:4px}.book:hover .bt{color:var(--blue)}.status{color:#777;padding:40px 0}@media(max-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:640px){.wrap{padding:22px 18px 55px}.top{padding:20px 18px}.title{font-size:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 15px}}
</style></head><body><div class="top"><a class="brand" href="/">성의고등학교 도서관</a><a class="home" href="/">처음 화면</a></div><main class="wrap"><a class="back" href="/">← 추천도서가 있는 첫 화면으로</a><h1 id="title" class="title">추천도서</h1><div id="desc" class="desc"></div><div id="status" class="status">추천목록을 불러오는 중…</div><div id="grid" class="grid"></div></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('list')||'';function href(b){return '/topic-search.html?q='+encodeURIComponent(b.title||'')+'&book='+encodeURIComponent(b.id||'')+'&chunk='+encodeURIComponent(b.chunk??0)}
(async()=>{if(!id){$('status').textContent='추천목록을 찾을 수 없습니다.';return;}try{const r=await fetch('/api/index?route=recommendations&mode=list&id='+encodeURIComponent(id)),j=await r.json();if(!r.ok)throw new Error(j.message||'추천목록을 불러오지 못했습니다.');const l=j.list;$('title').textContent=l.name||'추천도서';$('desc').textContent=l.description||'';document.title=(l.name||'추천도서')+' · 성의고등학교 도서관';$('status').style.display='none';$('grid').innerHTML=(l.items||[]).map(x=>{const b=x.book||{};return `<a class="book" href="${href(b)}"><div class="coverbox">${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy">`:`<div class="nocover">${esc(b.title||'표지 없음')}</div>`}</div><div class="bt">${esc(b.title)}</div><div class="ba">${esc(b.author)}</div></a>`}).join('');}catch(e){$('status').textContent=e.message;}})();
</script></body></html>
