<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성의고등학교 도서관 · 주제 검색</title><style>
:root{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",Arial,sans-serif;color:#222;background:#fff;--blue:#526ed3;--blue-soft:#eef2ff;--line:#e4e6eb;--muted:#6d7278}*{box-sizing:border-box}body{margin:0;background:#fff}.sticky{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid #e8e8e8}.bar{max-width:1320px;margin:auto;padding:13px 24px 15px}.bar-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.brand{font-weight:800;color:#222;text-decoration:none;font-size:15px}.page-title{font-size:22px;font-weight:850}.home{text-align:right}.home a{color:#666;text-decoration:none;border:1px solid #dfe1e5;background:#fff;padding:8px 12px;border-radius:18px;font-size:13px}.searchrow{display:flex;align-items:center;gap:9px;max-width:880px;margin:12px auto 0}.searchrow input{flex:1;min-width:0;padding:13px 16px;border:1.5px solid #bfc5d2;border-radius:8px;background:#fff;font-size:15px;outline:none}.searchrow input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(82,110,211,.08)}.searchrow button{border:0;background:var(--blue);color:white;border-radius:8px;padding:13px 18px;font-weight:800;cursor:pointer}.catalog{white-space:nowrap;border:1px solid #cfd5e5;background:#fff;border-radius:8px;padding:12px 14px;color:#3d4f91;text-decoration:none;font-size:14px}.wrap{max-width:1320px;margin:auto;padding:28px 24px 72px}.welcome{max-width:920px;margin:52px auto 36px;text-align:center;padding:46px 30px 40px;border-bottom:1px solid #eceef3}.welcome h2{font-size:29px;margin:0 0 12px;letter-spacing:-.6px}.welcome p{margin:0;color:#666;font-size:16px;line-height:1.85}.welcome .small{margin-top:14px;font-size:13px;color:#999}.intro-head{text-align:center;margin:3px 0 25px;color:#73777e}.status{max-width:1240px;margin:18px auto;color:#60656b;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}.card{background:#fff;border:1px solid #e0e3e8;border-radius:12px;padding:17px;min-width:0;cursor:pointer;transition:.15s ease;display:flex;flex-direction:column}.card:hover{border-color:#b9c4e8;box-shadow:0 7px 22px rgba(42,59,105,.08);transform:translateY(-1px)}.card-top{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px}.cover{width:96px;height:136px;object-fit:cover;background:#f0f1f3;border-radius:5px}.title{font-size:18px;font-weight:850;line-height:1.35;margin-bottom:6px;letter-spacing:-.25px}.meta{color:#666;font-size:12.5px;line-height:1.55}.fit{display:inline-block;font-size:11.5px;font-weight:800;background:var(--blue-soft);color:#4158ad;padding:4px 8px;border-radius:999px;margin-top:8px}.intro{line-height:1.6;color:#3f4348;font-size:13.5px;margin-top:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:4.8em}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 0}.tag{font-size:11.5px;background:#f5f6f8;border-radius:999px;padding:5px 8px;color:#555}.open-hint{margin-top:auto;padding-top:13px;color:#7180b4;font-size:12px}.more-wrap{text-align:center;margin:30px 0 0}.more{border:1px solid #bfc8df;background:#fff;color:#3f57aa;border-radius:8px;padding:12px 26px;font-weight:800;cursor:pointer}.more:disabled{opacity:.5}.hidden{display:none!important}.catalog-note{text-align:center;color:#92969c;font-size:12.5px;margin-top:20px}
.detail-page{max-width:1120px;margin:8px auto 0}.detail-back{border:0;background:none;color:#4e65b8;font-size:14px;font-weight:750;padding:7px 0 18px;cursor:pointer}.detail-hero{background:#f4f6ff;border:1px solid #e0e5f7;border-radius:16px;padding:30px;display:grid;grid-template-columns:180px 1fr;gap:30px}.detail-cover{width:180px;height:255px;object-fit:cover;background:#e9ebef;border-radius:7px;box-shadow:0 5px 16px rgba(0,0,0,.08)}.detail-title{font-size:28px;font-weight:900;line-height:1.35;margin:0 0 9px}.detail-meta{color:#62676f;font-size:14px;line-height:1.8}.detail-fit{display:inline-block;margin-top:12px;background:#fff;color:#4059b4;border:1px solid #d6ddf5;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.detail-reason{margin-top:18px;background:#fff;border-radius:10px;padding:16px 18px;line-height:1.7;color:#41464c;font-size:14px}.detail-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.detail-section{margin-top:26px;border-top:1px solid #e1e3e7;padding-top:24px}.detail-section h3{font-size:20px;margin:0 0 12px}.detail-text{white-space:pre-wrap;line-height:1.8;color:#3e4247;font-size:14.5px}.empty-detail{color:#999}.detail-actions{display:flex;gap:10px;margin-top:20px}.detail-actions a{display:inline-block;text-decoration:none;border-radius:8px;padding:11px 15px;font-size:13px;font-weight:800}.detail-actions .dls{background:var(--blue);color:#fff}.detail-actions .again{border:1px solid #ccd2e3;color:#4059a8;background:#fff}
@media(min-width:1380px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-top{grid-template-columns:1fr auto}.page-title{display:none}.detail-hero{grid-template-columns:145px 1fr}.detail-cover{width:145px;height:205px}}@media(max-width:650px){.welcome{margin:20px auto 20px;padding:30px 16px}.welcome h2{font-size:23px}.bar{padding:10px 12px 12px}.brand{font-size:13px}.searchrow{display:grid;grid-template-columns:1fr auto}.catalog{grid-column:1/-1;text-align:center;padding:9px}.wrap{padding:18px 14px 60px}.cards{grid-template-columns:1fr}.card-top{grid-template-columns:88px 1fr}.cover{width:88px;height:124px}.detail-hero{grid-template-columns:1fr;padding:22px}.detail-cover{width:130px;height:184px}.detail-title{font-size:23px}}
</style></head><body><header class="sticky"><div class="bar"><div class="bar-top"><a class="brand" href="/">성의고등학교 도서관</a><div class="page-title">주제 검색</div><div class="home"><a href="/">처음 화면</a></div></div><div class="searchrow"><input id="q" aria-label="주제 검색어" autocomplete="off" placeholder="찾고 싶은 주제나 관심 있는 내용을 적어보세요."><button id="searchBtn">주제 검색</button><a class="catalog" href="https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855" target="_blank" rel="noopener">소장·대출 확인</a></div></div></header><main class="wrap"><section id="welcome" class="welcome"><h2>관심 있는 내용을 우리 도서관 책에서 찾아보세요</h2><p>주제, 진로, 궁금한 내용처럼 찾고 싶은 것을 자연스럽게 적으면<br>성의고등학교 도서관 소장자료에서 관련 책을 찾아줍니다.</p><div class="small">제목이나 저자를 알고 있다면 상단의 ‘소장·대출 확인’을 이용하세요.</div></section><section id="resultView"><div id="introHead" class="intro-head hidden">주제, 진로, 관심 있는 내용을 자연스럽게 적어보세요.</div><div id="status" class="status"></div><div id="cards" class="cards"></div><div id="moreWrap" class="more-wrap hidden"><button id="moreBtn" class="more">더 보기</button></div><div id="catalog-note" class="catalog-note hidden">※ 대출 가능 여부는 상단의 ‘소장·대출 확인’에서 책 제목을 검색해 확인할 수 있습니다.</div></section><section id="detailView" class="detail-page hidden"></section></main><script>
const $=id=>document.getElementById(id);let currentQ='',nextOffset=0,total=0;const detailCache=new Map(),resultMap=new Map();
const DLS='https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855';
function setSearchMode(active){$('welcome').classList.toggle('hidden',active);$('introHead').classList.toggle('hidden',!active);$('catalog-note').classList.toggle('hidden',!active);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function representativeCall(list){const a=(list||[]).map(x=>String(x||'').trim()).filter(Boolean);if(!a.length)return '-';const cleaned=a.map(x=>x.replace(/\s+c\.\s*\d+\s*$/i,'').trim()).filter(Boolean);return [...new Set(cleaned)].sort((x,y)=>x.length-y.length||x.localeCompare(y,'ko'))[0]||a[0];}
function card(x){resultMap.set(x.id,x);return `<article class="card" role="button" tabindex="0" data-id="${esc(x.id)}" onclick="openBook('${encodeURIComponent(x.id)}',${x.chunk},true)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openBook('${encodeURIComponent(x.id)}',${x.chunk},true)}"><div class="card-top"><div>${x.cover?`<img class="cover" src="${esc(x.cover)}" alt="${esc(x.title)} 표지" loading="lazy">`:'<div class="cover"></div>'}</div><div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.author)}<br>${esc(x.publisher)} ${esc(x.year)}<br>청구기호 ${esc(representativeCall(x.callNumbers))}<br>${esc((x.locations||[])[0]||'도서관')} · ${x.copies||1}권 소장</div><span class="fit">${esc(x.fit)}</span></div></div><div class="intro">${esc(x.introPreview||'책 소개 메타데이터를 아직 수집하지 못한 도서입니다.')}</div><div class="tags">${[...(x.topics||[]),...(x.genres||[])].slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="open-hint">책을 눌러 소개·목차 자세히 보기 →</div></article>`;}
async function getDetail(id,chunk){const k=id+'|'+chunk;if(detailCache.has(k))return detailCache.get(k);const r=await fetch(`/api/index?route=book-detail&id=${encodeURIComponent(id)}&chunk=${chunk}`),j=await r.json();if(!r.ok)throw new Error(j.message||'추가 정보 없음');detailCache.set(k,j);return j;}
window.openBook=async(key,chunk,push=true)=>{const id=decodeURIComponent(key),x=resultMap.get(id);if(!x)return;$('resultView').classList.add('hidden');$('welcome').classList.add('hidden');$('detailView').classList.remove('hidden');$('detailView').innerHTML='<button class="detail-back" onclick="history.back()">← 검색 결과로 돌아가기</button><div class="detail-hero">상세 정보를 불러오는 중…</div>';if(push)history.pushState({q:currentQ,book:id,chunk},'',location.pathname+'?q='+encodeURIComponent(currentQ)+'&book='+encodeURIComponent(id)+'&chunk='+chunk);try{const d=await getDetail(id,chunk),reason=(x.reasons||[]).join(' · ')||'제목·주제·분류 정보를 종합해 찾았습니다.',tags=[...(d.topics||x.topics||[]),...(d.genres||x.genres||[])].slice(0,8);$('detailView').innerHTML=`<button class="detail-back" onclick="history.back()">← 검색 결과로 돌아가기</button><div class="detail-hero"><div>${(d.cover||x.cover)?`<img class="detail-cover" src="${esc(d.cover||x.cover)}" alt="${esc(x.title)} 표지">`:'<div class="detail-cover"></div>'}</div><div><h2 class="detail-title">${esc(x.title)}</h2><div class="detail-meta">${esc(x.author)}<br>${esc(x.publisher)} · ${esc(x.year)}<br>청구기호 ${esc(representativeCall(x.callNumbers))}<br>${esc((x.locations||[])[0]||'도서관')} · ${x.copies||1}권 소장</div><span class="detail-fit">${esc(x.fit)}</span><div class="detail-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="detail-reason"><b>이 검색에 잘 맞는 이유</b><br>${esc(reason)}</div><div class="detail-actions"><a class="dls" href="${DLS}" target="_blank" rel="noopener">소장·대출 확인</a><a class="again" href="#intro">책 소개 보기</a></div></div></div><section id="intro" class="detail-section"><h3>책 소개</h3><div class="detail-text ${d.introduction?'':'empty-detail'}">${esc(d.introduction||x.introPreview||'책 소개 정보가 없습니다.')}</div></section><section class="detail-section"><h3>목차</h3><div class="detail-text ${d.toc?'':'empty-detail'}">${esc(d.toc||'목차 정보가 없습니다.')}</div></section>`;window.scrollTo({top:0,behavior:'smooth'});}catch(e){$('detailView').innerHTML=`<button class="detail-back" onclick="history.back()">← 검색 결과로 돌아가기</button><div class="detail-hero">${esc(e.message)}</div>`;}};
async function fetchPage(append=false){if(!currentQ)return;const offset=append?nextOffset:0;if(!append){$('status').textContent='우리 도서관 장서에서 찾는 중…';$('cards').innerHTML='';$('moreWrap').classList.add('hidden');resultMap.clear();}else{$('moreBtn').disabled=true;$('moreBtn').textContent='더 찾는 중…';}try{const r=await fetch('/api/index?route=search&q='+encodeURIComponent(currentQ)+'&offset='+offset+'&limit=12'),j=await r.json();if(!r.ok)throw new Error(j.message||'검색 오류');if(!append&&!j.results.length){$('status').textContent='조건에 맞는 책을 찾지 못했습니다. 검색어를 조금 다르게 적어보세요.';return;}total=j.total??j.results.length;nextOffset=j.nextOffset??offset+j.results.length;$('status').textContent=total>nextOffset?`조건에 맞는 책 ${total.toLocaleString()}권 중 ${nextOffset.toLocaleString()}권을 보고 있습니다.`:`조건에 맞는 책 ${total.toLocaleString()}권을 찾았습니다.`;$('cards').insertAdjacentHTML('beforeend',j.results.map(card).join(''));$('moreWrap').classList.toggle('hidden',!j.hasMore);$('moreBtn').disabled=false;$('moreBtn').textContent='더 보기';}catch(e){$('status').textContent=e.message;$('moreBtn').disabled=false;$('moreBtn').textContent='더 보기';}}
async function loadQuery(q,{push=false,replace=false,book=null,chunk=null}={}){q=String(q||'').trim();$('detailView').classList.add('hidden');$('resultView').classList.remove('hidden');if(!q){currentQ='';nextOffset=0;$('q').value='';$('cards').innerHTML='';$('status').textContent='';$('moreWrap').classList.add('hidden');setSearchMode(false);if(replace)history.replaceState({q:''},'',location.pathname);return;}currentQ=q;nextOffset=0;$('q').value=q;setSearchMode(true);const url=location.pathname+'?q='+encodeURIComponent(q);if(push)history.pushState({q},'',url);else if(replace)history.replaceState({q},'',url);await fetchPage(false);if(book&&resultMap.has(book))await openBook(encodeURIComponent(book),Number(chunk),false);}
async function search(){const q=$('q').value.trim();if(!q)return;await loadQuery(q,{push:true});}
$('searchBtn').onclick=search;$('moreBtn').onclick=()=>fetchPage(true);$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
window.addEventListener('popstate',e=>{const p=new URLSearchParams(location.search),q=(e.state&&typeof e.state.q==='string')?e.state.q:(p.get('q')||''),book=e.state?.book||p.get('book'),chunk=e.state?.chunk??p.get('chunk');loadQuery(q,{book,chunk});});
const params=new URLSearchParams(location.search),init=params.get('q')||'',initBook=params.get('book'),initChunk=params.get('chunk');if(init){history.replaceState({q:init,book:initBook||null,chunk:initChunk?Number(initChunk):null},'',location.href);loadQuery(init,{book:initBook,chunk:initChunk});}else{history.replaceState({q:''},'',location.pathname);setSearchMode(false);}
</script></body></html>
