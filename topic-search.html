c;font-size:12.5px;margin-top:22px}.detail-page{max-width:1120px;margin:28px auto 0}.detail-back{border:0;background:none;color:#4e65b8;font-size:14px;font-weight:750;padding:4px 0 18px;cursor:pointer}.detail-hero{background:#f4f6ff;border:1px solid #dfe5f7;border-radius:16px;padding:30px;display:grid;grid-template-columns:180px 1fr;gap:30px}.detail-cover{width:180px;height:255px;object-fit:cover;background:#e9ebef;border-radius:7px;box-shadow:0 5px 16px rgba(0,0,0,.07)}.detail-title{font-size:28px;font-weight:900;line-height:1.35;margin:0 0 9px}.detail-meta{color:#62676f;font-size:14px;line-height:1.8}.detail-fit{display:inline-block;margin-top:12px;background:#fff;color:#4059b4;border:1px solid #d6ddf5;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.detail-reason{margin-top:18px;background:#fff;border-radius:10px;padding:16px 18px;line-height:1.7;color:#41464c;font-size:14px}.detail-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.detail-actions{display:flex;gap:10px;margin-top:20px}.detail-actions a{display:inline-block;text-decoration:none;border-radius:8px;padding:11px 15px;font-size:13px;font-weight:800}.detail-actions .dls{background:var(--blue);color:#fff}.detail-section{margin-top:26px;border-top:1px solid #e1e3e7;padding-top:24px}.detail-section h3{font-size:20px;margin:0 0 14px}.detail-text{white-space:pre-wrap;line-height:1.85;color:#3e4247;font-size:14.5px}.toc-list{display:grid;gap:0;border-top:1px solid #eceef2}.toc-item{position:relative;padding:10px 8px 10px 22px;border-bottom:1px solid #eceef2;line-height:1.72;color:#3f444b;font-size:14px}.toc-item:before{content:"";position:absolute;left:6px;top:20px;width:4px;height:4px;border-radius:50%;background:#aeb8d8}.empty-detail{color:#999}.repair-note{font-size:12px;color:#7a8090;margin-top:8px}

</style></head><body><header class="sticky"><div class="bar"><div class="bar-top"><a class="brand" href="/">성의고등학교 도서관</a><div id="resetSearch" class="page-title" role="button" tabindex="0" title="검색 결과 초기화">주제 검색</div><div class="home"><a href="/">처음 화면</a></div></div><div class="searchrow"><input id="q" aria-label="주제 검색어" autocomplete="off" placeholder="찾고 싶은 주제나 관심 있는 내용을 적어보세요."><button id="searchBtn">주제 검색</button><button id="clearBtn" class="reset-btn" title="현재 검색 결과 초기화">초기화</button><a id="catalogBtn" class="catalog" href="https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855" target="_blank" rel="noopener">우리 도서관 도서 검색</a></div></div></header><main class="wrap"><section id="welcome" class="welcome"><h1>주제 검색</h1><p>주제, 진로, 궁금한 내용을 자연스럽게 적으면 성의고등학교 도서관 소장자료에서 관련 책을 찾아줍니다.</p><div class="hero-search"><input id="heroQ" aria-label="주제 검색어" autocomplete="off" placeholder="찾고 싶은 주제나 관심 있는 내용을 적어보세요."><button id="heroBtn">주제 검색</button></div></section><section id="resultView" class="hidden"><div id="status" class="status"></div><div id="cards" class="cards"></div><div id="moreWrap" class="more-wrap hidden"><button id="moreBtn" class="more">더 보기</button></div><div id="catalog-note" class="catalog-note">※ 대출 가능 여부는 상단의 ‘우리 도서관 도서 검색’에서 책 제목을 검색해 확인할 수 있습니다.</div></section><section id="detailView" class="detail-page hidden"></section></main><script>
const $=id=>document.getElementById(id);let currentQ='',nextOffset=0,total=0;const detailCache=new Map(),resultMap=new Map();
const DLS='https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function representativeCall(list){const a=(list||[]).map(x=>String(x||'').trim()).filter(Boolean);if(!a.length)return '-';const cleaned=a.map(x=>x.replace(/\s+c\.\s*\d+\s*$/i,'').trim()).filter(Boolean),freq=new Map();for(const x of cleaned)freq.set(x,(freq.get(x)||0)+1);return [...freq.entries()].sort((a,b)=>b[1]-a[1]||a[0].length-b[0].length||a[0].localeCompare(b[0],'ko'))[0]?.[0]||a[0];}
function setActive(active){document.body.classList.toggle('active-search',active);$('welcome').classList.toggle('hidden',active);$('resultView').classList.toggle('hidden',!active);}
function card(x){resultMap.set(x.id,x);const sid=CSS.escape(String(x.id));return `<article class="card" id="card-${esc(x.id)}" role="button" tabindex="0" data-id="${esc(x.id)}" onclick="openBook('${encodeURIComponent(x.id)}',${x.chunk},true)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openBook('${encodeURIComponent(x.id)}',${x.chunk},true)}"><div class="card-top"><div class="cover-slot">${x.cover?`<img class="cover" src="${esc(x.cover)}" alt="${esc(x.title)} 표지" loading="lazy">`:'<div class="cover"></div>'}</div><div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.author)}<br>${esc(x.publisher)} ${esc(x.year)}<br>청구기호 ${esc(representativeCall(x.callNumbers))}<br>${esc((x.locations||[])[0]||'도서관')} · ${x.copies||1}권 소장</div><span class="fit">${esc(x.fit)}</span></div></div><div class="intro intro-slot">${esc(x.introPreview||'책 소개 메타데이터를 확인하는 중입니다.')}</div><div class="tags">${[...(x.topics||[]),...(x.genres||[])].slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="open-hint">책을 눌러 소개·목차 자세히 보기 →</div></article>`;}
async function getDetail(id,chunk,isbn=''){const k=id+'|'+chunk;if(detailCache.has(k))return detailCache.get(k);const r=await fetch(`/api/index?route=book-detail&id=${encodeURIComponent(id)}&chunk=${chunk}&isbn=${encodeURIComponent(isbn||'')}&q=${encodeURIComponent(currentQ||'')}`),j=await r.json();if(!r.ok)throw new Error(j.message||'추가 정보 없음');detailCache.set(k,j);return j;}
function formatToc(raw){let s=String(raw||'').replace(/\r/g,'').trim();if(!s)return[];s=s.replace(/\s*[|｜]\s*/g,'\n').replace(/\s*[•▪◆◇▶▷]\s*/g,'\n').replace(/\s+(?=(?:제\s*\d+\s*(?:부|장|절)|\d+\s*장\b|Chapter\s*\d+|CHAPTER\s*\d+|PART\s*\d+|Part\s*\d+|머리말|프롤로그|에필로그|서문|들어가며|나가며|맺음말|부록))/g,'\n').replace(/\s+(?=\d{1,2}[.)]\s*[^0-9])/g,'\n');const parts=s.split(/\n+/).map(v=>v.replace(/^[-–—•·]+\s*/, '').trim()).filter(v=>v.length>1);const out=[];for(const part of parts){if(part.length>180&&/[;；]/.test(part)){out.push(...part.split(/\s*[;；]\s*/).map(x=>x.trim()).filter(Boolean));}else out.push(part);}return out.slice(0,300);}
async function hydrateMissing(rows){const missing=rows.filter(x=>!x.cover||!x.introPreview).sort((a,b)=>Number((a.title||'').includes(currentQ))-Number((b.title||'').includes(currentQ))).reverse().slice(0,4);for(const x of missing){try{const d=await getDetail(x.id,x.chunk,x.isbn13),el=document.getElementById('card-'+x.id);if(!el)continue;if(d.cover&&!x.cover){x.cover=d.cover;el.querySelector('.cover-slot').innerHTML=`<img class="cover" src="${esc(d.cover)}" alt="${esc(x.title)} 표지" loading="lazy">`;}if(d.introduction&&!x.introPreview){x.introPreview=d.introduction.slice(0,700);el.querySelector('.intro-slot').textContent=x.introPreview;}}catch{}}
}
window.openBook=async(key,chunk,push=true)=>{const id=decodeURIComponent(key),x=resultMap.get(id);if(!x)return;$('resultView').classList.add('hidden');$('welcome').classList.add('hidden');$('detailView').classList.remove('hidden');document.body.classList.add('active-search');$('detailView').innerHTML='<button class="detail-back" onclick="history.back()">← 검색 결과로 돌아가기</button><div class="detail-hero">상세 정보를 불러오는 중…</div>';if(push)history.pushState({q:currentQ,book:id,chunk},'',location.pathname+'?q='+encodeURIComponent(currentQ)+'&book='+encodeURIComponent(id)+'&chunk='+chunk);try{const d=await getDetail(id,chunk,x.isbn13),reason=(x.reasons||[]).join(' · ')||'제목·주제·분류 정보를 종합해 찾았습니다.',tags=[...(d.topics||x.topics||[]),...(d.genres||x.genres||[])].slice(0,8),tocItems=formatToc(d.toc);$('detailView').innerHTML=`<button class="detail-back" onclick="history.back()">← 검색 결과로 돌아가기</button><div class="detail-hero"><div>${(d.cover||x.cover)?`<img class="detail-cover" src="${esc(d.cover||x.cover)}" alt="${esc(x.title)} 표지">`:'<div class="detail-cover"></div>'}</div><div><h2 class="detail-title">${esc(x.title)}</h2><div class="detail-meta">${esc(x.author)}<br>${esc(x.publisher)} · ${esc(x.year)}<br>청구기호 ${esc(representativeCall(x.callNumbers))}<br>${esc((x.locations||[])[0]||'도서관')} · ${x.copies||1}권 소장</div><span class="detail-fit">${esc(x.fit)}</span><div class="detail-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="detail-reason"><b>이 검색에 잘 맞는 이유</b><br>${esc(reason)}</div><div class="detail-actions"><a class="dls" href="${DLS}" target="_blank" rel="noopener">우리 도서관 도서 검색</a></div></div></div><section class="detail-section"><h3>책 소개</h3><div class="detail-text ${d.introduction?'':'empty-detail'}">${esc(d.introduction||x.introPreview||'책 소개 정보가 없습니다.')}</div></section><section class="detail-section"><h3>목차</h3>${tocItems.length?`<div class="toc-list">${tocItems.map(v=>`<div class="toc-item">${esc(v)}</div>`).join('')}</div>`:`<div class="detail-text empty-detail">목차 정보가 없습니다.</div>`}</section>`;window.scrollTo({top:0,behavior:'smooth'});}catch(e){$('detailView').innerHTML=`<button class="detail-back" onclick="history.back()">← 검색 결과로 돌아가기</button><div class="detail-hero">${esc(e.message)}</div>`;}};
async function fetchPage(append=false){if(!currentQ)return;const offset=append?nextOffset:0;if(!append){$('status').textContent='우리 도서관 장서에서 찾는 중…';$('cards').innerHTML='';$('moreWrap').classList.add('hidden');resultMap.clear();}else{$('moreBtn').disabled=true;$('moreBtn').textContent='더 찾는 중…';}try{const r=await fetch('/api/index?route=search&q='+encodeURIComponent(currentQ)+'&offset='+offset+'&limit=12'),j=await r.json();if(!r.ok)throw new Error(j.message||'검색 오류');if(!append&&!j.results.length){$('status').textContent='조건에 맞는 책을 찾지 못했습니다. 검색어를 조금 다르게 적어보세요.';return;}total=j.total??j.results.length;nextOffset=j.nextOffset??offset+j.results.length;$('status').textContent=total>nextOffset?`조건에 맞는 책 ${total.toLocaleString()}권 중 ${nextOffset.toLocaleString()}권을 보고 있습니다.`:`조건에 맞는 책 ${total.toLocaleString()}권을 찾았습니다.`;$('cards').insertAdjacentHTML('beforeend',j.results.map(card).join(''));$('moreWrap').classList.toggle('hidden',!j.hasMore);$('moreBtn').disabled=false;$('moreBtn').textContent='더 보기';hydrateMissing(j.results);}catch(e){$('status').textContent=e.message;$('moreBtn').disabled=false;$('moreBtn').textContent='더 보기';}}
async function loadQuery(q,{push=false,replace=false,book=null,chunk=null}={}){q=String(q||'').trim();$('detailView').classList.add('hidden');if(!q){currentQ='';nextOffset=0;$('q').value='';$('heroQ').value='';$('cards').innerHTML='';$('status').textContent='';$('moreWrap').classList.add('hidden');setActive(false);if(replace)history.replaceState({q:''},'',location.pathname);return;}currentQ=q;nextOffset=0;$('q').value=q;$('heroQ').value=q;setActive(true);const url=location.pathname+'?q='+encodeURIComponent(q);if(push)history.pushState({q},'',url);else if(replace)history.replaceState({q},'',url);await fetchPage(false);if(book&&resultMap.has(book))await openBook(encodeURIComponent(book),Number(chunk),false);}
async function searchFrom(el){const q=$(el).value.trim();if(!q)return;await loadQuery(q,{push:true});}
function resetCurrentSearch(){history.pushState({q:''},'',location.pathname);loadQuery('');window.scrollTo({top:0,behavior:'smooth'});}
$('clearBtn').onclick=resetCurrentSearch;$('resetSearch').onclick=resetCurrentSearch;$('resetSearch').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();resetCurrentSearch();}});
$('searchBtn').onclick=()=>searchFrom('q');$('heroBtn').onclick=()=>searchFrom('heroQ');$('moreBtn').onclick=()=>fetchPage(true);$('q').addEventListener('keydown',e=>{if(e.key==='Enter')searchFrom('q');});$('heroQ').addEventListener('keydown',e=>{if(e.key==='Enter')searchFrom('heroQ');});
window.addEventListener('popstate',e=>{const p=new URLSearchParams(location.search),q=(e.state&&typeof e.state.q==='string')?e.state.q:(p.get('q')||''),book=e.state?.book||p.get('book'),chunk=e.state?.chunk??p.get('chunk');loadQuery(q,{book,chunk});});
const params=new URLSearchParams(location.search),init=params.get('q')||'',initBook=params.get('book'),initChunk=params.get('chunk');if(init){history.replaceState({q:init,book:initBook||null,chunk:initChunk?Number(initChunk):null},'',location.href);loadQuery(init,{book:initBook,chunk:initChunk});}else{history.replaceState({q:''},'',location.pathname);setActive(false);}
</script></body></html>
