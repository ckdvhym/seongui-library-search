<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성의고등학교 도서관 · 주제 검색</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}.sticky{position:sticky;top:0;z-index:50;background:rgba(247,247,245,.97);backdrop-filter:blur(9px);border-bottom:1px solid #e5e5e1}.bar{max-width:1440px;margin:auto;padding:12px 22px 14px}.bar-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.brand{font-weight:800;color:#171717;text-decoration:none}.page-title{font-size:22px;font-weight:850}.home{text-align:right}.home a{color:#555;text-decoration:none;border:1px solid #ddd;background:white;padding:8px 11px;border-radius:9px;font-size:13px}.searchrow{display:flex;align-items:center;gap:9px;max-width:900px;margin:11px auto 0}.searchrow input{flex:1;min-width:0;padding:13px 15px;border:1px solid #bbb;border-radius:12px;background:white;font-size:16px}.searchrow button{border:0;background:#171717;color:white;border-radius:11px;padding:13px 17px;font-weight:800;cursor:pointer}.catalog{white-space:nowrap;border:1px solid #d7d7d3;background:white;border-radius:11px;padding:12px 14px;color:#222;text-decoration:none;font-size:14px}.wrap{max-width:1440px;margin:auto;padding:25px 22px 72px}.intro-head{text-align:center;margin:2px 0 24px;color:#666}.status{max-width:1200px;margin:18px auto;color:#555}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.card{background:white;border:1px solid #e2e2df;border-radius:17px;padding:18px;min-width:0}.card-top{display:grid;grid-template-columns:105px minmax(0,1fr);gap:15px}.cover{width:105px;height:147px;object-fit:cover;background:#eee;border-radius:8px}.title{font-size:19px;font-weight:800;line-height:1.35;margin-bottom:6px}.meta{color:#666;font-size:13px;line-height:1.55}.fit{display:inline-block;font-size:12px;font-weight:800;background:#f0f2f4;padding:5px 8px;border-radius:999px;margin-top:8px}.intro{line-height:1.6;color:#333;font-size:14px;margin-top:13px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;min-height:5.6em}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{font-size:12px;background:#f6f6f3;border-radius:999px;padding:5px 8px}.reason{font-size:13px;color:#666;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:13px;border:1px solid #d6d6d2;background:white;color:#222;border-radius:9px;padding:9px 11px;cursor:pointer}.detail{display:none;background:#fafafa;border-radius:10px;padding:12px;margin-top:10px;white-space:pre-wrap;line-height:1.65;font-size:14px;max-height:300px;overflow:auto}.detail.show{display:block}.more-wrap{text-align:center;margin:30px 0 0}.more{border:1px solid #bbb;background:white;border-radius:12px;padding:13px 26px;font-weight:800;cursor:pointer}.more:disabled{opacity:.5}.hidden{display:none!important}.catalog-note{text-align:center;color:#888;font-size:13px;margin-top:16px}
@media(min-width:1380px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.bar-top{grid-template-columns:1fr auto}.page-title{display:none}.home{display:block}}@media(max-width:650px){.bar{padding:10px 12px 12px}.brand{font-size:14px}.searchrow{display:grid;grid-template-columns:1fr auto}.catalog{grid-column:1/-1;text-align:center;padding:9px}.wrap{padding:18px 14px 60px}.cards{grid-template-columns:1fr}.card-top{grid-template-columns:90px 1fr}.cover{width:90px;height:126px}}
</style></head><body><header class="sticky"><div class="bar"><div class="bar-top"><a class="brand" href="/">성의고등학교 도서관</a><div class="page-title">주제 검색</div><div class="home"><a href="/">처음 화면</a></div></div><div class="searchrow"><input id="q" aria-label="주제 검색어" autocomplete="off" placeholder="찾고 싶은 주제나 관심 있는 내용을 적어보세요."><button id="searchBtn">주제 검색</button><a class="catalog" href="https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855" target="_blank" rel="noopener">도서 검색</a></div></div></header><main class="wrap"><div class="intro-head">주제, 진로, 관심 있는 내용을 자연스럽게 적어보세요.</div><div id="status" class="status"></div><div id="cards" class="cards"></div><div id="moreWrap" class="more-wrap hidden"><button id="moreBtn" class="more">더 보기</button></div><div class="catalog-note">※ 대출 가능 여부는 상단의 ‘도서 검색’에서 책 제목을 검색해 확인할 수 있습니다.</div></main><script>
const $=id=>document.getElementById(id);let currentQ='',nextOffset=0,total=0,serial=0;const detailCache=new Map();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function card(x){const i=serial++,key=encodeURIComponent(x.id);return `<article class="card"><div class="card-top"><div>${x.cover?`<img class="cover" src="${esc(x.cover)}" alt="${esc(x.title)} 표지" loading="lazy">`:'<div class="cover"></div>'}</div><div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.author)}<br>${esc(x.publisher)} ${esc(x.year)}<br>청구기호 ${esc((x.callNumbers||[]).join(', ')||'-')}<br>${esc((x.locations||[]).join(', ')||'도서관')} · ${x.copies||1}권 소장</div><span class="fit">${esc(x.fit)}</span></div></div><div class="intro">${esc(x.introPreview||'책 소개 메타데이터를 아직 수집하지 못한 도서입니다.')}</div><div class="tags">${[...(x.topics||[]),...(x.genres||[])].slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="reason">왜 맞나요? ${esc((x.reasons||[]).join(' · ')||'제목·주제·분류 정보를 종합해 찾았습니다.')}</div><div class="actions"><button onclick="toggleDetail('${key}',${x.chunk},${i},'intro',this)">책 소개</button><button onclick="toggleDetail('${key}',${x.chunk},${i},'toc',this)">목차</button></div><div class="detail" id="intro${i}"></div><div class="detail" id="toc${i}"></div></article>`;}
async function getDetail(id,chunk){const k=id+'|'+chunk;if(detailCache.has(k))return detailCache.get(k);const r=await fetch(`/api/index?route=book-detail&id=${encodeURIComponent(id)}&chunk=${chunk}`),j=await r.json();if(!r.ok)throw new Error(j.message||'추가 정보 없음');detailCache.set(k,j);return j;}
window.toggleDetail=async(key,chunk,i,type,btn)=>{const id=decodeURIComponent(key),box=$(type+i),other=$(type==='intro'?'toc'+i:'intro'+i);if(box.classList.contains('show')){box.classList.remove('show');btn.textContent=type==='intro'?'책 소개':'목차';return;}other.classList.remove('show');box.textContent='불러오는 중…';box.classList.add('show');btn.textContent='접기';try{const j=await getDetail(id,chunk);box.textContent=type==='intro'?(j.introduction||'책 소개 정보가 없습니다.'):(j.toc||'목차 정보가 없습니다.');}catch(e){box.textContent=e.message;}};
async function fetchPage(append=false){if(!currentQ)return;const offset=append?nextOffset:0;if(!append){$('status').textContent='우리 도서관 장서에서 찾는 중…';$('cards').innerHTML='';$('moreWrap').classList.add('hidden');serial=0;}else{$('moreBtn').disabled=true;$('moreBtn').textContent='더 찾는 중…';}try{const r=await fetch('/api/index?route=search&q='+encodeURIComponent(currentQ)+'&offset='+offset+'&limit=12'),j=await r.json();if(!r.ok)throw new Error(j.message||'검색 오류');if(!append&&!j.results.length){$('status').textContent='조건에 맞는 책을 찾지 못했습니다. 검색어를 조금 다르게 적어보세요.';return;}total=j.total??j.results.length;nextOffset=j.nextOffset??offset+j.results.length;$('status').textContent=total>nextOffset?`조건에 맞는 책 ${total.toLocaleString()}권 중 ${nextOffset.toLocaleString()}권을 보고 있습니다.`:`조건에 맞는 책 ${total.toLocaleString()}권을 찾았습니다.`;$('cards').insertAdjacentHTML('beforeend',j.results.map(card).join(''));$('moreWrap').classList.toggle('hidden',!j.hasMore);$('moreBtn').disabled=false;$('moreBtn').textContent='더 보기';}catch(e){$('status').textContent=e.message;$('moreBtn').disabled=false;$('moreBtn').textContent='더 보기';}}
async function search(){const q=$('q').value.trim();if(!q)return;currentQ=q;nextOffset=0;history.replaceState({q},'',location.pathname+'?q='+encodeURIComponent(q));await fetchPage(false);}
$('searchBtn').onclick=search;$('moreBtn').onclick=()=>fetchPage(true);$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});const init=new URLSearchParams(location.search).get('q');if(init){$('q').value=init;currentQ=init;fetchPage(false);}
</script></body></html>
