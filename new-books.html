<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신간도서 · 학교도서관</title><style>*{box-sizing:border-box}body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#34383e;margin:0;background:white}.wrap{max-width:1100px;margin:auto;padding:30px 20px 80px}a{color:#516bc2}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;margin-top:28px}.book{border:1px solid #e4e8ef;border-radius:10px;padding:16px;cursor:pointer;text-align:left;background:white;min-height:175px}.book:hover{border-color:#7088c7}.cover{height:90px;display:grid;place-items:center;background:#f0f2f6;border-radius:5px;color:#8a92a4;margin-bottom:12px}.title{font-weight:750}.meta{color:#77808d;font-size:13px;margin-top:7px;line-height:1.6}.badge{display:inline-block;background:#e9f3ed;color:#287747;padding:3px 8px;border-radius:10px;font-size:12px}#detail section{margin-top:28px;border-top:1px solid #e4e8ef;padding-top:15px;line-height:1.8}#detail{margin-top:30px;border:0;padding:0}#detail[hidden]{display:none}select{padding:9px;border:1px solid #ddd;border-radius:8px}@media(max-width:750px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}} </style><link rel="stylesheet" href="/shared-book-detail.css"><script src="/shared-book-detail.js"></script></head><body><main class="wrap"><a href="/topic-search.html">← 주제 검색으로 돌아가기</a><h1 id="name">신간도서 전체보기</h1><p id="desc"></p><div id="listView"><label>주제 <select id="filter"><option value="">전체</option></select></label><div id="grid" class="grid"></div></div><section id="detail" hidden></section></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let books=[];function detail(i){const b=books[i];if(!b)return;$('listView').hidden=true;$('name').textContent=window.listName||'신간도서';$('desc').textContent=window.listDescription||'';const holdings=(b.books||[]).flatMap(x=>(x.callNumbers||[]).map((c,n)=>({callNumber:c,location:(x.locations||[])[n]||(x.locations||[])[0]||'도서관'})));$('detail').hidden=false;$('detail').innerHTML=LibraryBookDetail.render({title:b.title,author:b.author,publisher:b.publisher,isbn:b.isbn,cover:b.cover||b.books?.[0]?.cover||'',introduction:b.intro||b.books?.[0]?.introPreview||'',toc:b.toc||'',topics:b.topic?[b.topic]:[],holdings,copies:(b.books||[]).reduce((n,x)=>n+Number(x.copies||0),0)},{backLabel:'← 전체 목록으로',backAction:'showList()',pending:b.status!=='소장 중'});$('detail').scrollIntoView({behavior:'smooth'});}
function showList(){$('detail').hidden=true;$('listView').hidden=false;$('name').textContent=window.listName||'신간도서 전체보기';$('desc').textContent=window.listDescription||'';history.replaceState(null,'',location.pathname+'?list='+encodeURIComponent(new URLSearchParams(location.search).get('list')||''));window.scrollTo(0,0)}function render(){const f=$('filter').value;$('grid').innerHTML=books.map((b,i)=>({...b,i})).filter(b=>!f||b.topic===f).map(b=>`<button class="book" onclick="detail(${b.i})">${b.cover||b.books?.[0]?.cover?`<img class="cover" style="width:100%;height:125px;object-fit:contain" src="${esc(b.cover||b.books[0].cover)}" alt="${esc(b.title)} 표지">`:`<div class="cover">표지 준비 중</div>`}<div class="title">${esc(b.title)}</div><div class="meta">${esc(b.author)}<br>${esc(b.topic)}</div></button>`).join('');} (async()=>{const p=new URLSearchParams(location.search),r=await fetch('/api/index?route=new-books&mode=list&id='+encodeURIComponent(p.get('list')||''),{cache:'no-store'}),j=await r.json(),l=j.lists?.[0];if(!l){$('desc').textContent='현재 공개된 목록이 없습니다.';return;}window.listName=l.name;window.listDescription=l.description||'';$('name').textContent=l.name;$('desc').textContent=l.description||'';books=l.items||[];for(const t of [...new Set(books.map(x=>x.topic).filter(Boolean))]){const o=document.createElement('option');o.value=t;o.textContent=t;$('filter').append(o);}$('filter').onchange=render;render();const selected=Number(p.get('book'));if(p.has('book')&&Number.isInteger(selected))detail(books.findIndex((b,i)=>Number(b.sourceIndex??i)===selected));})().catch(e=>$('desc').textContent=e.message);</script></body></html>
