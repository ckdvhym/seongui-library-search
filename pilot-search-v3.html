async function loadAll(){
 let done=0,ok=0;document.querySelector("#load").textContent="불러오는 중…";
 for(const b of BASE){if(enriched[b.isbn]){done++;ok++;continue}try{const r=await fetch(`/api/yes24?isbn=${b.isbn}`);const j=await r.json();if(r.ok&&j.ok){enriched[b.isbn]=j.book||j;ok++}}catch(e){}done++;document.querySelector("#load").textContent=`진행 ${done}/${BASE.length} · 성공 ${ok}권`;await new Promise(x=>setTimeout(x,120))}
 localStorage.setItem("sg_yes24_pilot",JSON.stringify(enriched));document.querySelector("#load").textContent=`완료: ${BASE.length}권 중 ${ok}권 외부정보 확보.`;
}
function clearCache(){localStorage.removeItem("sg_yes24_pilot");enriched={};document.querySelector("#load").textContent="저장 정보를 지웠습니다."}
function setq(v){document.querySelector("#q").value=v;searchNow()}
function searchNow(){
 const q=document.querySelector("#q").value.trim();if(!q)return;const a=detect(q), labs=[];
 a.topics.forEach(k=>labs.push("주제: "+label(k)));if(a.material)labs.push("자료형: "+(a.material==="fiction"?"소설":"비문학"));
 if(a.purpose)labs.push("목적: "+(a.purpose==="career"?"진로":"수행평가·탐구"));if(a.emotion)labs.push("정서: "+(a.emotion==="sad"?"슬픔·상실":"반전"));
 document.querySelector("#intent").innerHTML=labs.map(x=>`<span class="chip">${esc(x)}</span>`).join("")||'<span class="chip">검색 의도를 충분히 해석하지 못함</span>';
 let rows=[];for(const raw of BASE){const b=merged(raw),r=evaluate(b,a);if(r)rows.push({b,...r})}rows.sort((x,y)=>y.score-x.score);rows=rows.slice(0,12);
 document.querySelector("#status").textContent=`“${q}” · 조건을 충족한 결과 ${rows.length}권 (60권 시험군)`;
 if(!rows.length){document.querySelector("#results").innerHTML='<div class="no"><b>조건에 충분히 맞는 책을 찾지 못했습니다.</b><br>현재는 60권 시험군만 검색합니다. 전체 장서에 책이 없다는 뜻은 아닙니다.<br><br>이번 버전은 약한 연관어만으로 결과를 억지로 채우지 않습니다.</div>';return}
 document.querySelector("#results").innerHTML=rows.map(x=>card(x.b,x.score,x.reasons)).join("");
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(b,s,reasons){
 const p=b.profile,rel=s>=70?"매우 적합":s>=45?"적합":"관련 있음";
 return `<div class="card"><div class="rel">${rel} · 점수 ${s}</div><div class="top">${b.cover?`<img class="cover" src="${esc(b.cover)}">`:""}<div><div class="title">${esc(b.title)}</div><div class="meta">${esc(b.author)} · ${esc(b.publisher)} · ${esc(b.year)}<br>청구기호 ${esc(b.call)} · ${esc(b.location)} · ${b.copies}권</div></div></div><div class="profile"><b>핵심 주제</b> ${(p.core||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}<br><b>장르</b> ${(p.genre||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div><div class="why"><b>왜 맞나요?</b><br>${reasons.map(esc).join("<br>")}</div>${b.intro?`<details><summary>YES24 책소개 보기</summary><div class="text">${esc(b.intro)}</div></details>`:""}</div>`;
}
</script></div></body></html>
