   if(["material","genre"].includes(g.axis)) strength=26;
   if(["author","title"].includes(g.axis)) strength=50;
   score+=strength; why.push(`${g.label}`);
 }
 // soft boosters: AI-related concepts that were not made mandatory
 const soft=[
  ["관련 주제",a.related_topics,[...arr(b.profile?.secondary),...arr(b.profile?.core)]],
  ["교과",a.curriculum_fields,arr(b.profile?.curriculum)],
  ["진로",a.career_fields,arr(b.profile?.career)]
 ];
 for(const [label,terms,vals] of soft){if(termMatches(vals,arr(terms))){score+=5;why.push(label+" 연계");}}
 return {score,why};
}
function fallbackAnalysis(q){
 // Emergency fallback only. It deliberately covers broad structural types,
 // not a fixed list of every possible topic.
 const x=norm(q), groups=[], topics=[], mats=[], genres=[], emo=[], curr=[], career=[];
 const add=(label,terms,axis)=>groups.push({label,terms,axis});
 if(/소설/.test(q)){mats.push("fiction");add("소설",["fiction","소설"],"material")}
 if(/에세이|수필/.test(q)){mats.push("essay");add("에세이",["essay","에세이","수필"],"material")}
 if(/(^|[^가-힣])시([^가-힣]|$)|시집/.test(" "+q+" ")){mats.push("poetry");add("시",["poetry","시","시집"],"material")}
 if(/슬프|슬픔|상실|애도|그리움/.test(q)){emo.push("슬픔","상실");add("슬픔·상실",["슬픔","상실","애도","그리움","비극"],"emotion")}
 const broad=[["수학",["수학"],"curriculum"],["과학",["과학","자연과학","기술과학"],"curriculum"],["역사",["역사","역사학","세계사","한국사"],"curriculum"]];
 for(const [w,t,ax] of broad)if(q.includes(w)){curr.push(w);add(w,t,ax)}
 if(/자기\s*(계발|개발)/.test(q)){genres.push("자기계발");add("자기계발",["자기계발","자기개발","습관","자기관리","동기부여","생산성"],"genre")}
 return {understood:groups.length>0,intent:"topic",title_query:"",author_query:"",material_types:mats,genres,primary_topics:topics,related_topics:[],curriculum_fields:curr,career_fields:career,emotions_tone:emo,audience:[],exclusions:[],required_groups:groups,explanation:"AI 연결을 사용할 수 없어 기본 구조 해석기로 처리했습니다."};
}
async function interpret(q){
 try{
   const r=await fetch("/api/gemini",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});
   const j=await r.json();
   if(r.ok&&j.ok) return {analysis:j.analysis, ai:true, model:j.model};
 }catch(e){}
 return {analysis:fallbackAnalysis(q),ai:false,model:"fallback"};
}
function renderInterpret(a,ai){
 const chips=[];
 for(const g of arr(a.required_groups)) chips.push(`${g.label} · ${axisLabel(g.axis)}`);
 const box=`<div class="${ai?"interpret":"warn"}"><b>${ai?"AI가 이렇게 이해했습니다":"AI 연결 전 임시 해석"}</b><div class="chips">${chips.map(x=>`<span class="chip">${esc(x)}</span>`).join("")||'<span class="chip">조건 해석 실패</span>'}</div><div class="small" style="margin-top:7px">${esc(a.explanation||"")}</div></div>`;
 document.querySelector("#interp").innerHTML=box;
}
function axisLabel(x){return {topic:"주제",material:"자료형",genre:"장르",career:"진로",curriculum:"교과",emotion:"정서",author:"저자",title:"제목",audience:"독자"}[x]||x}
async function go(){
 const q=document.querySelector("#q").value.trim();if(!q)return;
 document.querySelector("#status").textContent="검색어의 의미를 해석하는 중…";
 document.querySelector("#results").innerHTML="";
 const {analysis:a,ai,model}=await interpret(q);renderInterpret(a,ai);
 if(!a.understood || !arr(a.required_groups).length){
   document.querySelector("#status").textContent="검색어의 조건을 충분히 해석하지 못했습니다.";
   document.querySelector("#results").innerHTML='<div class="no"><b>검색어를 제대로 이해하지 못했습니다.</b><br>이 경우를 “관련 도서 0권”으로 처리하지 않습니다. Gemini 연결 후 다시 시험해 주세요.</div>';return;
 }
 let rows=[];
 for(const b of BASE){const r=scoreBook(b,a);if(r)rows.push({b,...r})}
 rows.sort((x,y)=>y.score-x.score);rows=rows.slice(0,12);
 document.querySelector("#status").textContent=`${ai?"Gemini "+model:"기본 해석기"} · 조건 충족 ${rows.length}권 (60권 시험군)`;
 if(!rows.length){
  document.querySelector("#results").innerHTML='<div class="no"><b>해석된 조건을 충족하는 책이 60권 시험군에서는 없습니다.</b><br>이번에는 “검색어를 이해하지 못함”과 “이해했지만 해당 책이 없음”을 구분합니다. 전체 장서에 책이 없다는 뜻은 아닙니다.</div>';return;
 }
 document.querySelector("#results").innerHTML='<div class="grid">'+rows.map((x,i)=>card(x.b,x.score,x.why,i)).join("")+'</div>';
 enrichRows(rows);
}
function card(b,score,why,i){
 const p=b.profile||{}, e=cache[b.isbn]||{};
 return `<div class="card" id="c${i}"><div class="badge">${score>=70?"매우 적합":score>=45?"적합":"관련 있음"} · ${score}</div><div class="head"><div id="cover${i}">${e.cover?`<img class="cover" src="${esc(e.cover)}">`:`<div class="cover ph">표지 불러오는 중</div>`}</div><div><div class="title">${esc(b.title)}</div><div class="meta">${esc(b.author)} · ${esc(b.publisher)} · ${esc(b.year)}<br>청구기호 ${esc(b.call)} · ${esc(b.location)} · ${b.copies}권</div></div></div>
 <div class="line"><b>왜 맞나요?</b> ${why.map(esc).join(" + ")}</div>
 <div class="line"><b>핵심 주제</b> ${arr(p.core).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
 <div class="line"><b>자료 성격</b> <span class="tag">${esc(p.material)}</span> ${arr(p.genre).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
 <div id="intro${i}" class="intro">${e.bookIntroduction?shortIntro(e.bookIntroduction):"YES24 책소개를 불러오는 중입니다."}</div></div>`;
}
function shortIntro(s){s=String(s||"").replace(/\s+/g," ").trim();return esc(s.length>260?s.slice(0,260)+"…":s)}
async function enrichRows(rows){
 let changed=false;
 for(let i=0;i<rows.length;i++){
  const b=rows[i].b;if(!b.isbn)continue;
  let e=cache[b.isbn];
  if(!e){
   try{const r=await fetch(`/api/yes24?isbn=${encodeURIComponent(b.isbn)}`);const j=await r.json();if(r.ok&&j.ok){e=j.book||j;cache[b.isbn]=e;changed=true}}catch(_){}
  }
  if(e){
   if(e.cover)document.querySelector(`#cover${i}`).innerHTML=`<img class="cover" src="${esc(e.cover)}">`;
   document.querySelector(`#intro${i}`).innerHTML=e.bookIntroduction?`<b>책 소개</b><br>${shortIntro(e.bookIntroduction)}`:"책 소개 정보가 없습니다.";
  } else {
   document.querySelector(`#cover${i}`).innerHTML='<div class="cover ph">표지 없음</div>';
   document.querySelector(`#intro${i}`).textContent="책 소개 정보가 없습니다.";
  }
 }
 if(changed)localStorage.setItem("sg_yes24_pilot",JSON.stringify(cache));
}
function setQ(q){document.querySelector("#q").value=q;go()}
</script></body></html>
