<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성의고등학교 도서관 자료 검색</title><style>
:root{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",Arial,sans-serif;color:#222;background:#fff;--blue:#4f6ed6;--blue-soft:#f4f6ff;--line:#dfe3eb;--muted:#70757d}*{box-sizing:border-box}body{margin:0;background:#fff}.page{min-height:100vh}.brand{max-width:1280px;margin:auto;padding:30px 30px 0;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}.brand-logo{height:20px;width:auto;max-width:48px;object-fit:contain;display:none}.brand-logo.show{display:block}.main{width:min(900px,calc(100% - 40px));margin:0 auto;padding-top:clamp(150px,24vh,265px);padding-bottom:90px;text-align:center;transition:padding-top .22s ease,width .22s ease}.main h1{font-size:36px;letter-spacing:-1px;margin:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:52px;text-align:left}.choice{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:15px;padding:38px 36px;min-height:185px;box-shadow:0 7px 24px rgba(31,43,77,.035);transition:.16s ease;cursor:pointer}.choice:hover{border-color:#b8c5ea;box-shadow:0 12px 30px rgba(57,78,139,.09);transform:translateY(-2px)}.choice:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 18%,transparent);outline-offset:3px}.choice h2{font-size:26px;margin:0 0 12px;letter-spacing:-.4px}.choice p{font-size:15px;font-weight:700;color:#4e535a;margin:0;line-height:1.65}.choice.primary{border-color:#d9dff1}.choice.primary h2{color:var(--blue)}
.rec-zone{display:none;text-align:left;margin:44px auto 0;padding-top:30px;border-top:1px solid #eceef3}.has-recommendations.main{width:min(1040px,calc(100% - 40px));padding-top:clamp(58px,8vh,92px);padding-bottom:54px}.has-recommendations .choices{max-width:900px;margin-left:auto;margin-right:auto;margin-top:34px}.has-recommendations .choice{min-height:150px;padding:29px 32px}.has-recommendations .rec-zone{display:block}.rec-zone-title{font-size:22px;font-weight:900;letter-spacing:-.45px;margin-bottom:24px}.rec-list{margin-top:28px}.rec-list:first-of-type{margin-top:0}.rec-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:15px}.rec-name{font-size:19px;font-weight:900;letter-spacing:-.3px;line-height:1.35}.rec-desc{font-size:13.5px;color:#747a82;margin-top:5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rec-all{flex:0 0 auto;color:#5d6fae;text-decoration:none;font-size:13.5px;font-weight:850;padding-bottom:2px}.rec-books{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.rec-book{text-decoration:none;color:inherit;min-width:0}.rec-cover-wrap{aspect-ratio:2/2.9;border-radius:8px;background:#f0f1f4;overflow:hidden;border:1px solid #eceef2}.rec-cover{width:100%;height:100%;object-fit:cover;display:block}.rec-no-cover{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#a2a6ad;font-size:11px;padding:12px}.rec-book-title{font-size:15.5px;font-weight:850;letter-spacing:-.2px;line-height:1.42;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rec-book-author{font-size:13px;color:#747a82;line-height:1.4;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rec-book:hover .rec-book-title{color:var(--blue)}.beta-note{position:fixed;left:18px;right:18px;bottom:13px;text-align:center;color:#a0a4aa;font-size:11.5px;line-height:1.45;letter-spacing:-.1px;pointer-events:none;z-index:5;display:none}.beta-note.show{display:block}
@media(max-width:820px){.has-recommendations.main{width:min(900px,calc(100% - 36px))}.rec-books{grid-template-columns:repeat(4,minmax(0,1fr))}.rec-book:nth-child(5){display:none}}
@media(max-width:720px){.brand{padding:22px}.main{padding-top:90px}.main h1{font-size:29px}.choices{grid-template-columns:1fr;margin-top:36px}.choice{min-height:150px;padding:30px 26px}.has-recommendations.main{padding-top:52px;width:calc(100% - 32px)}.has-recommendations .choices{margin-top:28px}.has-recommendations .choice{min-height:132px;padding:24px}.rec-zone{margin-top:34px;padding-top:24px}.rec-zone-title{font-size:20px}.rec-head{align-items:center}.rec-desc{display:none}.rec-books{display:grid;grid-auto-flow:column;grid-auto-columns:118px;grid-template-columns:none;overflow-x:auto;gap:14px;padding:2px 2px 9px;scroll-snap-type:x proximity}.rec-book{scroll-snap-align:start}.rec-book:nth-child(5){display:block}.rec-cover-wrap{height:171px;aspect-ratio:auto}}
</style></head><body><div class="page"><div class="brand"><img id="brandLogo" class="brand-logo" alt="학교 로고"><span id="brandText">성의고등학교 도서관</span></div><main id="main" class="main"><h1 id="homeTitle">성의고등학교 도서관 자료 검색</h1><div class="choices"><a id="bookSearch" class="choice" href="https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855"><h2>도서 검색</h2><p>제목·저자 등 알고 있는 정보로 찾기</p></a><a class="choice primary" href="/topic-search.html"><h2>주제 검색</h2><p>관심 있는 주제나 내용으로 찾기</p></a></div><section id="recZone" class="rec-zone" aria-label="추천도서"><div class="rec-zone-title">지금 함께 읽어볼 책</div><div id="recLists"></div></section></main><div id="betaNote" class="beta-note"></div></div><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sessionSeed(){try{let x=sessionStorage.getItem('library-rec-seed');if(!x){x=Date.now().toString(36)+Math.random().toString(36).slice(2);sessionStorage.setItem('library-rec-seed',x);}return x;}catch{return Date.now().toString(36);}}
function bookHref(b){return '/topic-search.html?q='+encodeURIComponent(b.title||'')+'&book='+encodeURIComponent(b.id||'')+'&chunk='+encodeURIComponent(b.chunk??0);}
function renderRecommendations(lists=[]){if(!lists.length)return;const host=$('recLists');host.innerHTML=lists.map(l=>`<div class="rec-list"><div class="rec-head"><div><div class="rec-name">${esc(l.name)}</div>${l.description?`<div class="rec-desc">${esc(l.description)}</div>`:''}</div><a class="rec-all" href="/recommendations.html?list=${encodeURIComponent(l.id)}">전체보기 ›</a></div><div class="rec-books">${(l.items||[]).map(x=>{const b=x.book||{};return `<a class="rec-book" href="${bookHref(b)}"><div class="rec-cover-wrap">${b.cover?`<img class="rec-cover" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy">`:`<div class="rec-no-cover">${esc(b.title||'표지 없음')}</div>`}</div><div class="rec-book-title">${esc(b.title)}</div><div class="rec-book-author">${esc(b.author)}</div></a>`}).join('')}</div></div>`).join('');$('main').classList.add('has-recommendations');}
async function loadRecommendations(){try{const r=await fetch('/api/index?route=recommendations&mode=home&seed='+encodeURIComponent(sessionSeed()));if(!r.ok)return;const j=await r.json();if(j.ok&&j.lists?.length)renderRecommendations(j.lists);}catch{}}
(async()=>{let settings=null;try{const r=await fetch('/api/index?route=school-settings');if(r.ok){settings=await r.json();const text=$('brandText'),logo=$('brandLogo');if(settings.schoolName&&text)text.textContent=settings.schoolName;if(settings.homeTitle){$('homeTitle').textContent=settings.homeTitle;document.title=settings.homeTitle;}if(settings.logoDataUrl&&logo){logo.src=settings.logoDataUrl;logo.classList.add('show');}if(settings.dlsUrl)$('bookSearch').href=settings.dlsUrl;if(settings.accentColor)document.documentElement.style.setProperty('--blue',settings.accentColor);const note=$('betaNote');if(note&&settings.footerNotice?.enabled!==false&&settings.footerNotice?.text){note.textContent=settings.footerNotice.text;note.classList.add('show');}}}catch{}if(settings?.features?.recommendations!==false)loadRecommendations();})();
</script></body></html>
