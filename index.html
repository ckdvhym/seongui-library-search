<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성의고등학교 도서관 자료 검색</title><style>
:root{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",Arial,sans-serif;color:#222;background:#fff;--blue:#4f6ed6;--line:#dfe3eb;--muted:#7f858d}*{box-sizing:border-box}body{margin:0;background:#fff}.page{min-height:100vh}.brand{padding:28px 38px 0;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}.brand-logo{height:22px;width:auto;max-width:52px;object-fit:contain;display:none}.brand-logo.show{display:block}.main{width:min(900px,calc(100% - 40px));margin:0 auto;padding-top:clamp(138px,22vh,245px);padding-bottom:88px;text-align:center}.main h1{font-size:36px;letter-spacing:-1px;margin:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:52px;text-align:left}.choice{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:15px;padding:38px 36px;min-height:185px;box-shadow:0 7px 24px rgba(31,43,77,.035);transition:.16s ease;cursor:pointer}.choice:hover{border-color:#b8c5ea;box-shadow:0 12px 30px rgba(57,78,139,.09);transform:translateY(-2px)}.choice:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 18%,transparent);outline-offset:3px}.choice h2{font-size:26px;margin:0 0 12px;letter-spacing:-.4px}.choice p{font-size:15px;font-weight:700;color:#4e535a;margin:0;line-height:1.65}.choice.primary{border-color:#d9dff1}.choice.primary h2{color:var(--blue)}.beta-note{display:none;max-width:720px;margin:62px auto 0;padding-top:18px;border-top:1px solid #f0f1f3;text-align:center;color:#9ca1a8;font-size:11.8px;line-height:1.65;letter-spacing:-.1px}.beta-note.show{display:block}
@media(max-width:720px){.brand{padding:22px 20px 0}.main{padding-top:88px}.main h1{font-size:29px}.choices{grid-template-columns:1fr;margin-top:36px}.choice{min-height:150px;padding:30px 26px}.beta-note{margin-top:46px}}
</style></head><body><div class="page"><div class="brand"><img id="brandLogo" class="brand-logo" alt="학교 로고"><span id="brandText">성의고등학교 도서관</span></div><main class="main"><h1 id="homeTitle">성의고등학교 도서관 자료 검색</h1><div class="choices"><a id="bookSearch" class="choice" href="https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855"><h2>도서 검색</h2><p>제목·저자 등 알고 있는 정보로 찾기</p></a><a class="choice primary" href="/topic-search.html"><h2>주제 검색</h2><p>관심 있는 주제나 내용으로 찾기</p></a></div><div id="betaNote" class="beta-note"></div></main></div><script>
(async()=>{try{const r=await fetch('/api/index?route=school-settings');if(!r.ok)return;const settings=await r.json(),text=document.getElementById('brandText'),logo=document.getElementById('brandLogo'),title=document.getElementById('homeTitle'),book=document.getElementById('bookSearch'),note=document.getElementById('betaNote');if(settings.schoolName&&text)text.textContent=settings.schoolName;if(settings.homeTitle&&title){title.textContent=settings.homeTitle;document.title=settings.homeTitle;}if(settings.logoDataUrl&&logo){logo.src=settings.logoDataUrl;logo.classList.add('show');}if(settings.dlsUrl&&book)book.href=settings.dlsUrl;if(settings.accentColor)document.documentElement.style.setProperty('--blue',settings.accentColor);if(note&&settings.footerNotice?.enabled!==false&&settings.footerNotice?.text){note.textContent=settings.footerNotice.text;note.classList.add('show');}}catch{}})();
</script></body></html>
