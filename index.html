<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성의고등학교 도서관 자료 검색</title><style>
:root{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",Arial,sans-serif;color:#222;background:#fff;--blue:#4f6ed6;--blue-soft:#f4f6ff;--line:#dfe3eb;--muted:#70757d}*{box-sizing:border-box}body{margin:0;background:#fff}.page{min-height:100vh}.brand{max-width:1280px;margin:auto;padding:30px 30px 0;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}.brand-logo{height:20px;width:auto;max-width:48px;object-fit:contain;display:none}.brand-logo.show{display:block}.main{width:min(1000px,calc(100% - 40px));margin:0 auto;padding-top:clamp(140px,22vh,245px);padding-bottom:110px;text-align:center}.main h1{font-size:36px;letter-spacing:-1px;margin:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:52px auto 0;max-width:900px;text-align:left}.choice{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:15px;padding:38px 36px;min-height:185px;box-shadow:0 7px 24px rgba(31,43,77,.035);transition:.16s ease;cursor:pointer}.choice:hover{border-color:#b8c5ea;box-shadow:0 12px 30px rgba(57,78,139,.09);transform:translateY(-2px)}.choice:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 18%,transparent);outline-offset:3px}.choice h2{font-size:26px;margin:0 0 12px;letter-spacing:-.4px}.choice p{font-size:15px;font-weight:700;color:#4e535a;margin:0;line-height:1.65}.choice.primary{border-color:#d9dff1}.choice.primary h2{color:var(--blue)}.extra{max-width:900px;margin:84px auto 0;text-align:left}.extra.hidden{display:none}.extra h2{font-size:21px;margin:0 0 8px;letter-spacing:-.3px}.extra .desc{font-size:13.5px;color:#7a7f87;margin:0 0 20px}.browse-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.browse-box{border:1px solid #e5e7ec;border-radius:14px;padding:18px;background:#fff}.browse-title{font-weight:850;margin-bottom:12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{display:inline-block;text-decoration:none;color:#48526b;border:1px solid #dfe3ed;background:#fafbfe;border-radius:999px;padding:7px 10px;font-size:12.5px;font-weight:700}.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}.rec-list{border-top:1px solid #eceef2}.rec-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.rec-badge{font-size:12px;color:var(--blue);font-weight:800}.books{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.book{text-decoration:none;color:inherit;min-width:0}.book-cover{width:100%;aspect-ratio:2/2.85;object-fit:cover;background:#f0f1f3;border-radius:7px;border:1px solid #eceef2}.book-title{font-size:13px;font-weight:800;line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.book-meta{font-size:11.5px;color:#838890;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event{max-width:900px;margin:36px auto 0;border:1px solid color-mix(in srgb,var(--blue) 24%,#ddd);background:var(--blue-soft);border-radius:13px;padding:16px 18px;text-align:left}.event.hidden{display:none}.event a{color:inherit;text-decoration:none}.event b{color:var(--blue)}.event p{margin:5px 0 0;font-size:13px;color:#636a74;line-height:1.6}
@media(max-width:800px){.books{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.brand{padding:22px}.main{padding-top:86px}.main h1{font-size:29px}.choices{grid-template-columns:1fr;margin-top:36px}.choice{min-height:150px;padding:30px 26px}.extra{margin-top:64px}.browse-grid{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="page"><div class="brand"><img id="brandLogo" class="brand-logo" alt="학교 로고"><span id="brandText">성의고등학교 도서관</span></div><main class="main"><h1 id="homeTitle">성의고등학교 도서관 자료 검색</h1><div class="choices"><a id="bookSearch" class="choice" href="https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855"><h2>도서 검색</h2><p>제목·저자 등 알고 있는 정보로 찾기</p></a><a class="choice primary" href="/topic-search.html"><h2>주제 검색</h2><p>관심 있는 주제나 내용으로 찾기</p></a></div><div id="event" class="event hidden"></div><section id="browse" class="extra hidden"><h2>둘러보기</h2><p class="desc">무엇을 찾을지 아직 정하지 못했다면 우리 도서관 자료가 있는 주제부터 살펴보세요.</p><div id="browseGrid" class="browse-grid"></div></section><section id="newBooks" class="extra hidden"><h2>새로 들어온 책</h2><p class="desc">최근 도서관에 등록된 책입니다.</p><div id="newBookList" class="books"></div></section><section id="recommend" class="extra hidden"><div class="rec-head"><div><h2 id="recName">지금 함께 읽어볼 책</h2><p id="recDesc" class="desc"></p></div><span id="recType" class="rec-badge"></span></div><div id="recBooks" class="books"></div></section></main></div><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let settings={features:{}};
function bookUrl(b){return `/topic-search.html?q=${encodeURIComponent(b.title)}&book=${encodeURIComponent(b.id)}&chunk=${encodeURIComponent(b.chunk)}`;}
async function loadBrowse(){if(!settings.features?.browse)return;try{const r=await fetch('/api/index?route=discovery&action=browse'),j=await r.json();if(!r.ok||!j.groups?.length)return;$('browseGrid').innerHTML=j.groups.map(g=>`<div class="browse-box"><div class="browse-title">${esc(g.title)}</div><div class="chips">${g.items.map(x=>`<a class="chip" href="/topic-search.html?q=${encodeURIComponent(x.query)}">${esc(x.query)}</a>`).join('')}</div></div>`).join('');$('browse').classList.remove('hidden');}catch{}}

async function loadNewBooks(){if(!settings.features?.newBooks)return;try{const r=await fetch('/api/index?route=discovery&action=new'),j=await r.json();if(!r.ok||!j.books?.length)return;$('newBookList').innerHTML=j.books.slice(0,6).map(b=>`<a class="book" href="${bookUrl(b)}">${b.cover?`<img class="book-cover" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy">`:'<div class="book-cover"></div>'}<div class="book-title">${esc(b.title)}</div><div class="book-meta">${esc(b.author)}</div></a>`).join('');$('newBooks').classList.remove('hidden');}catch{}}
async function loadRecommendations(){if(!settings.features?.recommendations)return;try{const r=await fetch('/api/index?route=recommendations&mode=active'),j=await r.json(),list=(j.lists||[]).find(x=>x.featured);if(!r.ok||!list?.items?.length)return;$('recName').textContent=list.name||'지금 함께 읽어볼 책';$('recDesc').textContent=list.description||'';$('recType').textContent=list.type||'';$('recBooks').innerHTML=list.items.slice(0,6).map(x=>{const b=x.book;return `<a class="book" href="${bookUrl(b)}">${b.cover?`<img class="book-cover" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy">`:'<div class="book-cover"></div>'}<div class="book-title">${esc(b.title)}</div><div class="book-meta">${esc(b.author)}</div></a>`}).join('');$('recommend').classList.remove('hidden');}catch{}}
(async()=>{try{const r=await fetch('/api/index?route=school-settings'),j=await r.json();if(r.ok){settings=j;const text=$('brandText'),logo=$('brandLogo');if(j.schoolName)text.textContent=j.schoolName;if(j.homeTitle){$('homeTitle').textContent=j.homeTitle;document.title=j.homeTitle;}if(j.logoDataUrl){logo.src=j.logoDataUrl;logo.classList.add('show');}if(j.dlsUrl)$('bookSearch').href=j.dlsUrl;if(j.accentColor)document.documentElement.style.setProperty('--blue',j.accentColor);if(j.features?.eventBanner&&j.event?.enabled&&j.event?.title){$('event').innerHTML=`${j.event.url?`<a href="${esc(j.event.url)}">`:''}<b>${esc(j.event.title)}</b>${j.event.description?`<p>${esc(j.event.description)}</p>`:''}${j.event.url?'</a>':''}`;$('event').classList.remove('hidden');}}}catch{}await Promise.all([loadBrowse(),loadNewBooks(),loadRecommendations()]);})();
</script></body></html>
