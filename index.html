<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>성의고등학교 도서관 주제 검색</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:34px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;font-size:18px}.home{border:1px solid #ddd;background:white;border-radius:10px;padding:9px 12px;cursor:pointer}.hero{padding:60px 0 32px;text-align:center}.hero h1{font-size:38px;margin:0 0 12px}.hero p{color:#666;font-size:17px}.searchbox{display:flex;gap:10px;max-width:760px;margin:26px auto 14px}.searchbox input{flex:1;padding:17px 18px;border:1px solid #cfcfcf;border-radius:14px;font-size:17px}.searchbox button,.btn{border:0;background:#171717;color:white;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer}.switch{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.switch a{background:white;border:1px solid #ddd;border-radius:12px;padding:12px 16px;color:#222;text-decoration:none}.status{max-width:760px;margin:20px auto;color:#555}.cards{display:grid;gap:14px}.card{display:grid;grid-template-columns:110px 1fr;gap:18px;background:white;border:1px solid #e2e2df;border-radius:16px;padding:18px}.cover{width:110px;height:154px;object-fit:cover;background:#eee;border-radius:8px}.title{font-size:20px;font-weight:800;margin-bottom:5px}.meta{color:#666;font-size:14px;line-height:1.6}.fit{display:inline-block;font-size:12px;font-weight:800;background:#f0f2f4;padding:5px 8px;border-radius:999px;margin:8px 0}.intro{line-height:1.65;color:#333}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tag{font-size:12px;background:#f6f6f3;border-radius:999px;padding:5px 8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.actions a{font-size:13px;border:1px solid #ddd;background:white;color:#222;border-radius:9px;padding:9px 10px;text-decoration:none;cursor:pointer}.detail{display:none;background:#fafafa;border-radius:10px;padding:12px;margin-top:10px;white-space:pre-wrap;line-height:1.6}.detail.show{display:block}@media(max-width:650px){.hero h1{font-size:30px}.searchbox{flex-direction:column}.card{grid-template-columns:80px 1fr}.cover{width:80px;height:112px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">성의고등학교 도서관 주제 검색</div><button class="home" id="homeBtn">🏠 처음으로</button></div><section class="hero" id="hero"><h1>말로 찾는 우리 도서관 책</h1><p>찾고 싶은 책이나 관심 있는 내용을 편하게 적어보세요.</p><div class="searchbox"><input id="q" aria-label="검색어"><button id="searchBtn">주제 검색</button></div><div class="switch"><a href="https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855" target="_blank" rel="noopener">우리 도서관 도서 검색</a></div></section><div id="status" class="status"></div><div id="cards" class="cards"></div></div><script>
const $=x=>document.getElementById(x);const school='https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EC%84%B1%EC%9D%98%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&provCode=R10&neisCode=R100000855';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function search(){const q=$('q').value.trim();if(!q)return;$('status').textContent='우리 도서관 장서에서 찾는 중…';$('cards').innerHTML='';history.replaceState({q},'',location.pathname+'?q='+encodeURIComponent(q));try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();if(!r.ok)throw new Error(j.message||'검색 오류');if(!j.results.length){$('status').textContent='조건에 맞는 책을 찾지 못했습니다. 검색어를 조금 다르게 적어보세요.';return;}$('status').textContent=`${j.results.length}권을 찾았습니다.`+(j.intent?.aiInterpreted?' 자연어 의도를 함께 해석했습니다.':'');$('cards').innerHTML=j.results.map((x,i)=>`<article class="card"><div>${x.cover?`<img class="cover" src="${esc(x.cover)}" alt="${esc(x.title)} 표지" loading="lazy">`:'<div class="cover"></div>'}</div><div><div class="title">${esc(x.title)}</div><div class="meta">${esc(x.author)} · ${esc(x.publisher)} ${esc(x.year)}<br>청구기호 ${esc((x.callNumbers||[]).join(', ')||'-')} · ${esc((x.locations||[]).join(', ')||'도서관')} · ${x.copies||1}권 소장</div><span class="fit">${esc(x.fit)}</span><div class="intro">${esc(x.introPreview||'책 소개 메타데이터를 아직 수집하지 못한 도서입니다.')}</div><div class="tags">${[...(x.topics||[]),...(x.genres||[])].slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="meta">왜 맞나요? ${esc((x.reasons||[]).join(' · ')||'제목·주제·분류 정보를 종합해 찾았습니다.')}</div><div class="actions"><button onclick="detail('${esc(x.id)}',${x.chunk},${i})">책 소개·목차 보기</button><a href="${school}" target="_blank" rel="noopener">우리 도서관에서 확인</a></div><div class="detail" id="d${i}"></div></div></article>`).join('');}catch(e){$('status').textContent=e.message;}}
window.detail=async(id,chunk,i)=>{const box=$('d'+i);if(box.classList.contains('show')){box.classList.remove('show');return;}box.textContent='불러오는 중…';box.classList.add('show');try{const r=await fetch(`/api/book-detail?id=${encodeURIComponent(id)}&chunk=${chunk}`);const j=await r.json();if(!r.ok)throw new Error(j.message||'추가 정보 없음');box.textContent=(j.introduction?`책 소개\n${j.introduction}`:'책 소개 없음')+(j.toc?`\n\n목차\n${j.toc}`:'');}catch(e){box.textContent=e.message;}};
$('searchBtn').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});$('homeBtn').onclick=()=>{history.replaceState({},'',location.pathname);$('q').value='';$('cards').innerHTML='';$('status').textContent='';window.scrollTo({top:0,behavior:'smooth'});};const init=new URLSearchParams(location.search).get('q');if(init){$('q').value=init;search();}
</script></body></html>
