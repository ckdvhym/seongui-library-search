let enriched=JSON.parse(localStorage.getItem("sg_yes24_pilot")||"{}");

// Concept graph: related concepts expand recall, but do not automatically satisfy unrelated mandatory axes.
const CONCEPTS={
 "건축":["건축","건축학","건물","공간","도시","주거","설계","디자인","가우디","스마트시티","bim","건설"],
 "정보":["정보","정보기술","IT","컴퓨터","디지털","AI","인공지능","데이터","프로그래밍","소프트웨어","코딩","반도체","전자","통신","미디어","스마트","자동화"],
 "환경":["환경","생태","기후","기후변화","기후위기","온난화","탄소","플라스틱","해양","지구","재난"],
 "AI":["AI","인공지능","머신러닝","딥러닝","자동화","알고리즘","데이터","컴퓨터","정보기술"],
 "의료":["의료","의학","건강","간호","약학","약사","의사","보건","질병","치료","세포","유전자","생명"],
 "약학":["약학","약사","의약","약물","의료","의학","건강","생명","화학","바이오"],
 "추리":["추리","미스터리","탐정","범죄","사건","살인","수사","반전","스릴러"],
 "청소년":["청소년","십대","10대","학생","학교","성장","친구"],
 "인권":["인권","차별","혐오","불평등","장애","소수자","이주","권리"],
 "경제":["경제","금융","시장","자본","투자","화폐"],
 "역사":["역사","세계사","한국사","문명","과거","역사학"],
 "과학":["과학","물리","화학","생물","생명","천문","우주","수학","기술"],
 "수학":["수학","통계","확률","숫자","미적분","기하","데이터"],
 "우주":["우주","천문","행성","달","화성","코스모스"],
 "법":["법","재판","판사","형사","범죄","수사","정의"],
 "진로":["진로","직업","전공","학과","커리어","직업세계","꿈"],
 "슬픔":["슬픈","슬픔","상실","그리움","비극","눈물","이별","죽음","아픔","애도","외로움","우울"],
 "따뜻함":["따뜻","위로","힐링","감동","공감","희망","다정"],
 "반전":["반전","충격","예상밖","뒤집","미스터리","추리"]
};

const MATERIAL={
 fiction:["소설","소설책","이야기","문학소설"],
 nonfiction:["비문학","정보서","정보책","교양서","지식책","자료","정보"],
 essay:["에세이","수필"],
 picture:["그림책"],
 original:["원전","고전원전"]
};
const PURPOSE={
 career:["진로","직업","전공","학과","커리어","꿈"],
 assignment:["수행평가","수행 평가","과제","탐구","보고서","발표"],
 casual:["재미","가볍","술술","편하게"]
};
const EMOTION={
 sad:CONCEPTS["슬픔"], warm:CONCEPTS["따뜻함"], twist:CONCEPTS["반전"]
};

const compact=s=>String(s||"").toLowerCase().replace(/[^0-9a-z가-힣]/g,"");
const includesAny=(text,arr)=>arr.some(x=>compact(text).includes(compact(x)));
const allText=b=>[b.title,b.author,b.publisher,b.tags,b.intro,b.toc,b.summary].join(" ");

function detect(q){
 const qc=compact(q), axes={topics:[],material:null,purpose:null,emotion:null};
 for(const [k,vals] of Object.entries(CONCEPTS)){
   if(includesAny(q,[k,...vals])) axes.topics.push(k);
 }
 if(includesAny(q,MATERIAL.fiction)) axes.material="fiction";
 else if(includesAny(q,MATERIAL.nonfiction)) axes.material="nonfiction";
 else if(includesAny(q,MATERIAL.essay)) axes.material="essay";
 else if(includesAny(q,MATERIAL.picture)) axes.material="picture";
 else if(includesAny(q,MATERIAL.original)) axes.material="original";
 if(includesAny(q,PURPOSE.career)) axes.purpose="career";
 else if(includesAny(q,PURPOSE.assignment)) axes.purpose="assignment";
 else if(includesAny(q,PURPOSE.casual)) axes.purpose="casual";
 if(includesAny(q,EMOTION.sad)) axes.emotion="sad";
 else if(includesAny(q,EMOTION.warm)) axes.emotion="warm";
 else if(includesAny(q,EMOTION.twist)) axes.emotion="twist";

 // Remove generic concept labels when a more specific one is present.
 if(axes.topics.includes("정보") && (axes.topics.includes("AI"))) axes.topics=axes.topics.filter(x=>x!=="정보");
 if(axes.topics.includes("의료") && axes.topics.includes("약학")) axes.topics=axes.topics.filter(x=>x!=="의료");
 axes.topics=[...new Set(axes.topics)];
 return axes;
}

function materialMatch(b,m){
 const t=compact(b.tags);
 if(!m)return true;
 if(m==="fiction") return t.includes("소설");
 if(m==="nonfiction") return t.includes("비문학")||t.includes("정보서");
 if(m==="essay") return t.includes("에세이");
 if(m==="picture") return t.includes("그림책");
 if(m==="original") return t.includes("원전");
 return true;
}
function purposeMatch(b,p){
 if(!p)return true;
 const t=compact(b.tags);
 if(p==="career"){
   // Career queries prefer informational/nonfiction books; fiction is not forbidden only if explicitly requested.
   return t.includes("비문학")||t.includes("정보서")||t.includes("에세이")||t.includes("진로")||t.includes("직업");
 }
 if(p==="assignment") return true;
 return true;
}
function conceptScore(b,k){
 const text=allText(b), tags=b.tags||"";
 const vals=[k,...(CONCEPTS[k]||[])];
 let s=0, hits=[];
 for(const v of vals){
   const c=compact(v); if(c.length<2)continue;
   if(compact(tags).includes(c)){s+=9;hits.push(v);}
   else if(compact(b.title).includes(c)){s+=8;hits.push(v);}
   else if(compact(b.intro).includes(c)){s+=4;hits.push(v);}
   else if(compact(b.toc).includes(c)){s+=2;hits.push(v);}
 }
 return {score:Math.min(s,35),hits:[...new Set(hits)]};
}
function emotionScore(b,e){
 if(!e)return {score:0,hits:[],matched:true};
 const arr=EMOTION[e], text=allText(b), tags=b.tags||"";
 let s=0,h=[];
 for(const v of arr){
   if(compact(tags).includes(compact(v))){s+=10;h.push(v);}
   else if(compact(b.intro).includes(compact(v))){s+=4;h.push(v);}
 }
 return {score:Math.min(s,30),hits:[...new Set(h)],matched:s>=8};
}

function evaluate(b,axes,q){
 // Hard filters.
 if(!materialMatch(b,axes.material)) return null;
 if(!purposeMatch(b,axes.purpose)) return null;

 let score=0, reasons=[], topicMatched=0;
 for(const k of axes.topics){
   // "진로" is purpose, not a content topic.
   if(k==="진로") continue;
   const r=conceptScore(b,k);
   if(r.score>=8){topicMatched++;score+=r.score;reasons.push(`${k}: ${r.hits.slice(0,4).join("·")}`);}
 }
 const needed=axes.topics.filter(x=>x!=="진로").length;
 if(needed>0 && topicMatched<needed) return null; // AND across requested topic axes

 const er=emotionScore(b,axes.emotion);
 if(axes.emotion && !er.matched) return null;
 score+=er.score;
 if(er.hits.length) reasons.push(`정서: ${er.hits.slice(0,4).join("·")}`);

 if(axes.material){score+=18;reasons.push("자료형 조건 충족");}
 if(axes.purpose==="career"){score+=12;reasons.push("진로·정보 탐색에 적합한 자료형");}
 if(axes.purpose==="assignment"){score+=8;reasons.push("탐구·수행평가 목적");}

 // Exact title/author still useful but never overrides hard conditions.
 if(compact(b.title).includes(compact(q)) && compact(q).length>2) score+=35;
 if(/작가|저자|소설가/.test(q) && compact(b.author).includes(compact(q.replace(/작가|저자|소설가/g,"")))) score+=25;

 return {score,reasons};
}

function merged(b){const e=enriched[b.isbn]||{};return {...b,...e,intro:e.bookIntroduction||"",toc:e.tableOfContents||"",summary:e.bookSummary||"",cover:e.cover||""};}
async function loadAll(){
 let done=0,ok=0; document.querySelector("#loadStatus").textContent="불러오는 중…";
 for(const b of BASE){
  if(enriched[b.isbn]){done++;ok++;continue;}
  try{const r=await fetch(`/api/yes24?isbn=${b.isbn}`);const j=await r.json();if(r.ok&&j.ok){enriched[b.isbn]=j.book||j;ok++;}}catch(e){}
  done++; document.querySelector("#loadStatus").textContent=`진행 ${done} / ${BASE.length} · 성공 ${ok}권`;
  await new Promise(res=>setTimeout(res,120));
 }
 localStorage.setItem("sg_yes24_pilot",JSON.stringify(enriched));
 document.querySelector("#loadStatus").textContent=`완료: ${BASE.length}권 중 ${ok}권 외부정보 확보.`;
}
function clearCache(){localStorage.removeItem("sg_yes24_pilot");enriched={};document.querySelector("#loadStatus").textContent="저장된 외부정보를 지웠습니다.";}
function setQ(v){document.querySelector("#q").value=v;searchNow();}
function searchNow(){
 const q=document.querySelector("#q").value.trim(); if(!q)return;
 const axes=detect(q);
 const labels=[];
 axes.topics.filter(x=>x!=="진로").forEach(x=>labels.push(`주제: ${x}`));
 if(axes.material)labels.push(`자료형: ${{fiction:"소설",nonfiction:"비문학·정보서",essay:"에세이",picture:"그림책",original:"원전"}[axes.material]}`);
 if(axes.purpose)labels.push(`목적: ${{career:"진로",assignment:"수행평가·탐구",casual:"가벼운 독서"}[axes.purpose]}`);
 if(axes.emotion)labels.push(`정서: ${{sad:"슬픔·상실",warm:"따뜻함·위로",twist:"반전"}[axes.emotion]}`);
 document.querySelector("#intent").innerHTML=labels.map(x=>`<span class="chip">${esc(x)}</span>`).join("") || '<span class="chip">명확한 조건을 추출하지 못함</span>';

 let rows=[];
 for(const raw of BASE){const b=merged(raw), r=evaluate(b,axes,q); if(r)rows.push({b,...r});}
 rows.sort((a,b)=>b.score-a.score);
 const strong=rows.filter(x=>x.score>=20).slice(0,12);
 document.querySelector("#status").textContent=`“${q}” · 조건을 만족한 결과 ${strong.length}권 (60권 시험군)`;
 if(!strong.length){
   document.querySelector("#results").innerHTML=`<div class="noresult"><b>조건에 충분히 맞는 책을 찾지 못했습니다.</b><br>현재는 60권 시험군만 대상으로 검색하고 있습니다. 실제 전체 장서에서 결과가 없다는 뜻은 아닙니다.<br><br><span style="color:#666">이번 버전은 결과 수를 억지로 채우지 않습니다.</span></div>`;
   return;
 }
 document.querySelector("#results").innerHTML=strong.map(x=>card(x.b,x.score,x.reasons)).join("");
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function card(b,s,reasons){
 const rel=s>=60?"매우 적합":s>=35?"적합":"관련 있음";
 return `<div class="card"><div class="rel">${rel} · 점수 ${s}</div><div class="top">${b.cover?`<img src="${esc(b.cover)}">`:""}<div><div class="title">${esc(b.title)}</div><div class="meta">${esc(b.author)} · ${esc(b.publisher)} · ${esc(b.year)}<br>청구기호 ${esc(b.call)} · ${esc(b.location)} · ${b.copies}권</div><div>${b.tags.split(" ").slice(0,8).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div></div><div class="reason"><b>왜 맞나요?</b><br>${reasons.map(esc).join("<br>")}</div>${b.intro?`<details><summary>YES24 책소개 보기</summary><div class="text">${esc(b.intro)}</div></details>`:""}${b.toc?`<details><summary>목차 보기</summary><div class="text">${esc(b.toc)}</div></details>`:""}</div>`;
}
