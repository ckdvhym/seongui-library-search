<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>둘러보기 | 성의고등학교 도서관</title><style>
:root{font-family:"Noto Sans KR","Pretendard","Malgun Gothic",Arial,sans-serif;color:#222;background:#fff;--blue:#4f6ed6;--blue-soft:#f4f6ff;--line:#e2e5eb;--muted:#747982}*{box-sizing:border-box}body{margin:0;background:#fff}.top{max-width:1120px;margin:auto;padding:28px 28px 0;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;text-decoration:none;color:inherit}.brand-logo{height:20px;width:auto;max-width:48px;object-fit:contain;display:none}.brand-logo.show{display:block}.home{font-size:13px;color:#666;text-decoration:none}.wrap{width:min(980px,calc(100% - 40px));margin:0 auto;padding:72px 0 90px}.hero{text-align:center;margin-bottom:44px}.hero h1{font-size:34px;margin:0 0 10px;letter-spacing:-.8px}.hero p{margin:0;color:var(--muted);font-size:14px}.section{margin-top:48px}.section.hidden{display:none}.section h2{font-size:21px;margin:0 0 8px}.desc{font-size:13.5px;color:var(--muted);margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.box{border:1px solid var(--line);border-radius:14px;padding:19px;background:#fff}.box-title{font-weight:850;margin-bottom:12px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-block;text-decoration:none;color:#46516b;border:1px solid #dfe3ed;background:#fafbfe;border-radius:999px;padding:8px 11px;font-size:12.5px;font-weight:750}.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}.books{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.book{text-decoration:none;color:inherit;min-width:0}.cover{width:100%;aspect-ratio:2/2.85;object-fit:cover;background:#f0f1f3;border:1px solid #eceef2;border-radius:7px}.book-title{font-size:13px;font-weight:800;line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.book-meta{font-size:11.5px;color:#858a92;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rec-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}.badge{font-size:12px;color:var(--blue);font-weight:800}.event{border:1px solid color-mix(in srgb,var(--blue) 24%,#ddd);background:var(--blue-soft);border-radius:13px;padding:16px 18px}.event a{color:inherit;text-decoration:none}.event b{color:var(--blue)}.event p{margin:5px 0 0;font-size:13px;color:#636a74;line-height:1.6}.empty{color:#8a8f97;font-size:13px;padding:18px 0}
@media(max-width:800px){.books{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.top{padding:22px}.wrap{padding-top:52px}.hero h1{font-size:29px}.grid{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="top"><a class="brand" href="/"><img id="brandLogo" class="brand-logo" alt="학교 로고"><span id="brandText">성의고등학교 도서관</span></a><a class="home" href="/">처음 화면</a></div><main class="wrap"><div class="hero"><h1>둘러보기</h1><p>무엇을 읽을지 아직 정하지 못했다면, 우리 도서관에 실제로 있는 책부터 살펴보세요.</p></div><section id="event" class="section hidden"></section><section id="browse" class="section hidden"><h2>주제와 관심사로 찾기</h2><p class="desc">학생들이 자주 탐구하는 분야 중 우리 도서관 장서가 충분한 주제만 보여줍니다.</p><div id="browseGrid" class="grid"></div></section><section id="recommend" class="section hidden"><div class="rec-head"><div><h2 id="recName">지금 함께 읽어볼 책</h2><p id="recDesc" class="desc"></p></div><span id="recType" class="badge"></span></div><div id="recBooks" class="books"></div></section><section id="newBooks" class="section hidden"><h2>새로 들어온 책</h2><p class="desc">최근 도서관에 등록된 책입니다.</p><div id="newBookList" class="books"></div></section></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let settings={features:{}};
function bookUrl(b){return `/topic-search.html?q=${encodeURIComponent(b.title)}&book=${encodeURIComponent(b.id)}&chunk=${encodeURIComponent(b.chunk)}`;}
async function loadBrowse(){if(settings.features?.browse===false)return;try{const r=await fetch('/api/index?route=discovery&action=browse'),j=await r.json();if(!r.ok||!j.groups?.length)return;$('browseGrid').innerHTML=j.groups.map(g=>`<div class="box"><div class="box-title">${esc(g.title)}</div><div class="chips">${g.items.map(x=>`<a class="chip" href="/topic-search.html?q=${encodeURIComponent(x.query)}">${esc(x.label||x.query)}</a>`).join('')}</div></div>`).join('');$('browse').classList.remove('hidden');}catch{}}
async function loadNewBooks(){if(!settings.features?.newBooks)return;try{const r=await fetch('/api/index?route=discovery&action=new'),j=await r.json();if(!r.ok||!j.books?.length)return;$('newBookList').innerHTML=j.books.slice(0,6).map(b=>`<a class="book" href="${bookUrl(b)}">${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy">`:'<div class="cover"></div>'}<div class="book-title">${esc(b.title)}</div><div class="book-meta">${esc(b.author)}</div></a>`).join('');$('newBooks').classList.remove('hidden');}catch{}}
async function loadRecommendations(){if(!settings.features?.recommendations)return;try{const r=await fetch('/api/index?route=recommendations&mode=active'),j=await r.json(),list=(j.lists||[]).find(x=>x.featured);if(!r.ok||!list?.items?.length)return;$('recName').textContent=list.name||'지금 함께 읽어볼 책';$('recDesc').textContent=list.description||'';$('recType').textContent=list.type||'';$('recBooks').innerHTML=list.items.slice(0,6).map(x=>{const b=x.book;return `<a class="book" href="${bookUrl(b)}">${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" loading="lazy">`:'<div class="cover"></div>'}<div class="book-title">${esc(b.title)}</div><div class="book-meta">${esc(b.author)}</div></a>`}).join('');$('recommend').classList.remove('hidden');}catch{}}
(async()=>{try{const r=await fetch('/api/index?route=school-settings'),j=await r.json();if(r.ok){settings=j;if(j.schoolName)$('brandText').textContent=j.schoolName;if(j.logoDataUrl){$('brandLogo').src=j.logoDataUrl;$('brandLogo').classList.add('show');}if(j.accentColor)document.documentElement.style.setProperty('--blue',j.accentColor);if(j.features?.eventBanner&&j.event?.enabled&&j.event?.title){$('event').innerHTML=`<div class="event">${j.event.url?`<a href="${esc(j.event.url)}">`:''}<b>${esc(j.event.title)}</b>${j.event.description?`<p>${esc(j.event.description)}</p>`:''}${j.event.url?'</a>':''}</div>`;$('event').classList.remove('hidden');}}}catch{}await Promise.all([loadBrowse(),loadRecommendations(),loadNewBooks()]);})();
</script></body></html>
