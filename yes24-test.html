<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YES24 도서정보 연결 테스트</title>
<style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;color:#222}h1{font-size:26px}.note{background:#f5f5f5;padding:14px 16px;border-radius:10px;margin-bottom:20px}button{padding:11px 16px;border:0;border-radius:9px;background:#111;color:#fff;cursor:pointer}#status{margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{border:1px solid #ddd;border-radius:12px;padding:16px}.top{display:flex;gap:14px}img{width:90px;height:128px;object-fit:cover;background:#eee}.title{font-weight:700;font-size:18px}.meta{font-size:13px;color:#666;margin-top:5px}.badge{display:inline-block;margin:4px 5px 0 0;padding:3px 7px;border-radius:999px;background:#eee;font-size:12px}details{margin-top:12px}summary{cursor:pointer;font-weight:600}.text{white-space:pre-wrap;font-size:13px;line-height:1.55;margin-top:8px;max-height:220px;overflow:auto}.ok{background:#e9f7ee}.no{background:#fff0f0}</style></head>
<body><h1>성의고 도서관 · YES24 정보 연결 테스트</h1><div class="note">우리 도서관 소장자료 중 서로 다른 성격의 책을 시험합니다. 이 화면은 관리자용 임시 테스트이며 학생용 검색 화면은 아닙니다.</div>
<button onclick="run()">10권 정보 불러오기</button><div id="status">버튼을 누르면 YES24 API 연결 상태를 확인합니다.</div><div id="grid" class="grid"></div>
<script>
const books=[["지구 끝의 온실","9791191824001"],["가면산장 살인사건","9788990982575"],["투명한 나선","9791170614043"],["광합성 인간","9788965967415"],["세상을 바꾼 화학","9788965822912"],["세상이 그대를 속일지라도","9788962627145"],["수족관","9791198547514"],["흐르는 강물처럼","9791130649672"],["너는 달밤에 빛나고+Fragments","9791127851866"],["근대여성작가선","9788932038445"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function one(name,isbn){const card=document.createElement("div");card.className="card";card.innerHTML=`<b>${esc(name)}</b><div class="meta">${isbn} · 불러오는 중…</div>`;document.querySelector("#grid").appendChild(card);try{const r=await fetch(`/api/yes24?isbn=${isbn}`);const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||j.message||`HTTP ${r.status}`);const b=j.book||j,intro=b.bookIntroduction||"",summary=b.bookSummary||"",toc=b.tableOfContents||"";card.classList.add("ok");card.innerHTML=`<div class="top">${b.cover?`<img src="${esc(b.cover)}" alt="">`:""}<div><div class="title">${esc(b.title||name)}</div><div class="meta">${esc(b.author||"")} · ${esc(b.publisher||"")} · ${esc(b.publishDate||"")}</div><span class="badge">책소개 ${intro?"✓":"없음"}</span><span class="badge">요약 ${summary?"✓":"없음"}</span><span class="badge">목차 ${toc?"✓":"없음"}</span><span class="badge">표지 ${b.cover?"✓":"없음"}</span></div></div>${intro?`<details><summary>책소개 보기</summary><div class="text">${esc(intro)}</div></details>`:""}${summary?`<details><summary>요약 보기</summary><div class="text">${esc(summary)}</div></details>`:""}${toc?`<details><summary>목차 보기</summary><div class="text">${esc(toc)}</div></details>`:""}`;return true}catch(e){card.classList.add("no");card.innerHTML=`<b>${esc(name)}</b><div class="meta">${isbn}</div><p>불러오기 실패: ${esc(e.message)}</p>`;return false}}
async function run(){document.querySelector("#grid").innerHTML="";document.querySelector("#status").textContent="10권을 확인하고 있습니다…";let ok=0;for(const [n,i] of books)if(await one(n,i))ok++;document.querySelector("#status").textContent=`완료: ${books.length}권 중 ${ok}권에서 기본 도서정보 응답을 받았습니다. 각 카드에서 책소개·요약·목차 제공 여부를 확인하세요.`}
</script></body></html>
